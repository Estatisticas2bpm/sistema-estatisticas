<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alterar senha - 2º BPM</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eef3f8;font:14px Inter,Segoe UI,Arial,sans-serif;color:#172033;display:grid;place-items:center}.card{width:min(430px,92%);background:#fff;border:1px solid #d7e0ea;border-radius:16px;padding:25px;box-shadow:0 10px 34px #071b3320}.card h1{margin:0 0 7px;color:#071b33;font-size:22px}.card p{margin:0 0 20px;color:#66758a;line-height:1.5}.campo{margin-bottom:14px}.campo label{display:block;font-size:12px;font-weight:800;color:#455b70;margin-bottom:5px}.campo input{width:100%;padding:12px;border:1px solid #d7e0ea;border-radius:9px;font:inherit}.btn{width:100%;border:0;border-radius:9px;padding:13px;background:#0e4f8a;color:#fff;font-weight:900;cursor:pointer}.msg{display:none;margin-top:13px;padding:10px 12px;border-radius:9px}.msg.ok{display:block;background:#ecfdf3;color:#067647;border:1px solid #abefc6}.msg.erro{display:block;background:#fef3f2;color:#b42318;border:1px solid #fecdca}</style><script src="auth-config.js"></script><script src="auth-guard.js"></script></head><body><section class="card"><h1>Crie sua nova senha</h1><p>A senha recebida do administrador é temporária. Informe uma nova senha pessoal para continuar usando o sistema.</p><form id="form"><div class="campo"><label>Nova senha</label><input id="senha1" type="password" minlength="8" autocomplete="new-password" required></div><div class="campo"><label>Confirmar nova senha</label><input id="senha2" type="password" minlength="8" autocomplete="new-password" required></div><button id="salvar" class="btn" type="submit">Alterar senha</button><div id="msg" class="msg"></div></form></section><script>const cfg=window.SISTEMA_AUTH_CONFIG,$=id=>document.getElementById(id);function mensagem(t,c){$('msg').textContent=t;$('msg').className='msg '+c;}$('form').addEventListener('submit',async e=>{e.preventDefault();if(!cfg?.enabled){mensagem('A autenticação ainda não foi ativada no backend institucional.','erro');return;}const a=$('senha1').value,b=$('senha2').value;if(a!==b){mensagem('As senhas informadas são diferentes.','erro');return;}if(a.length<8){mensagem('A senha deve ter pelo menos 8 caracteres.','erro');return;}const auth=await window.SistemaAuth.ready;if(!auth)return;const bot=$('salvar');bot.disabled=true;bot.textContent='Salvando...';try{const r=await auth.client.auth.updateUser({password:a});if(r.error)throw r.error;const f=await auth.client.functions.invoke(cfg.adminFunction,{body:{action:'password_changed'}});if(f.error)throw f.error;if(f.data?.error)throw new Error(f.data.error);mensagem('Senha alterada com sucesso. Abrindo o sistema...','ok');setTimeout(()=>location.replace(cfg.homePage),700);}catch(err){console.error(err);mensagem('Não foi possível alterar a senha: '+err.message,'erro');}finally{bot.disabled=false;bot.textContent='Alterar senha';}});</script></body></html>
