name: Corrigir releitura direta da Auditoria

on:
  push:
    paths:
      - '.github/workflows/fix-auditoria-refresh-direto.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir falsos positivos da Auditoria
        shell: python
        run: |
          from pathlib import Path

          p = Path('auditoria.html')
          s = p.read_text(encoding='utf-8')

          # Turno é derivável da hora inicial; não exigir os dois campos gravados.
          s = s.replace(
            " if(vazio(o.turno))add(o,'baixa','Turno','Turno não informado.');",
            " if(vazio(o.turno)&&vazio(o.hora_inicial))add(o,'baixa','Turno','Turno e hora inicial não informados.');",
            1
          )

          # Para auditoria de completude, basta existirem latitude e longitude.
          # A validação geográfica mais rígida pertence ao mapa, não à auditoria.
          s = s.replace(
            "return {...o,__geo_ok:Boolean(g)||coordenadaValida(o),__geo_parcial:!g&&(latV!==lngV)}});",
            "return {...o,__geo_ok:Boolean(g)||(latV&&lngV),__geo_parcial:latV!==lngV}});",
            1
          )
          s = s.replace(
            "const x=direto.data,latV=!vazio(x.latitude),lngV=!vazio(x.longitude),atual={...x,__geo_ok:coordenadaValida(x),__geo_parcial:latV!==lngV};",
            "const x=direto.data,latV=!vazio(x.latitude),lngV=!vazio(x.longitude),atual={...x,__geo_ok:latV&&lngV,__geo_parcial:latV!==lngV};",
            1
          )

          p.write_text(s, encoding='utf-8')

      - name: Validar
        run: |
          grep -q "Turno e hora inicial não informados" auditoria.html
          grep -q "__geo_ok:Boolean(g)||(latV&&lngV)" auditoria.html
          grep -q "__geo_ok:latV&&lngV" auditoria.html

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "Corrige falsos positivos de GEO e turno na Auditoria"
          git push
