<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Operacional</title><style>*{box-sizing:border-box}:root{--n:#132b46;--b:#2556d8;--bg:#eef2f6;--l:#d7e0ea;--m:#64748b;--red:#b42318}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#1f2937}header{background:var(--n);color:white;padding:20px}.top{max-width:1300px;margin:auto;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0}.back{color:white;text-decoration:none;border:1px solid #ffffff80;padding:9px 14px;border-radius:8px}main{max-width:1300px;width:96%;margin:20px auto}.box{background:white;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #00000010}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.filters label{font-size:12px;font-weight:bold}.filters input,.filters select{width:100%;padding:9px;border:1px solid var(--l);border-radius:7px;margin-top:5px}.presets{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.presets button,.apply{border:0;background:var(--b);color:white;padding:9px 12px;border-radius:7px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card{background:white;border:1px solid var(--l);border-radius:10px;padding:13px}.card small{color:var(--m)}.card strong{display:block;font-size:25px;color:var(--n);margin-top:6px}.charts{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.chart{background:white;border-radius:12px;padding:18px}.bars{display:grid;gap:9px}.barline{display:grid;grid-template-columns:minmax(100px,1fr) 3fr 45px;gap:8px;align-items:center;font-size:13px}.track{height:13px;background:#e7edf4;border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--b)}.fill.red{background:var(--red)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--l);text-align:left;font-size:13px}th{background:#f8fafc}.scroll{overflow:auto;max-height:430px}@media(max-width:900px){.filters,.cards{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}@media(max-width:520px){.filters,.cards{grid-template-columns:1fr}}</style></head><body><header><div class="top"><h1>Dashboard Operacional</h1><a class="back" href="index.html">← Início</a></div></header><main>
<section class="box"><div class="presets"><button data-p="hoje">Hoje</button><button data-p="semana">Semana</button><button data-p="mes">Mês</button><button data-p="trimestre">Trimestre</button><button data-p="semestre">Semestre</button><button data-p="ano">Ano</button></div><div class="filters"><label>Data inicial<input id="ini" type="date"></label><label>Data final<input id="fim" type="date"></label><label>Situação<select id="status"><option value="">Todas</option><option>ATENDIDA</option><option>DEMANDA REPRIMIDA</option></select></label><label>Tipo/Crime<input id="crime" placeholder="Ex.: Furto"></label><label>Comandante<input id="cmd"></label><label>Município<input id="mun"></label><label>Bairro/localidade<input id="bairro"></label><label>Turno<select id="turno"><option value="">Todos</option><option>MADRUGADA</option><option>MANHÃ</option><option>TARDE</option><option>NOITE</option></select></label></div><button class="apply" id="aplicar" style="margin-top:12px">Aplicar filtros</button></section>
<section class="cards"><div class="card"><small>Demandas</small><strong id="kTotal">0</strong></div><div class="card"><small>Atendidas</small><strong id="kAt">0</strong></div><div class="card"><small>Reprimidas</small><strong id="kRep">0</strong></div><div class="card"><small>Prisões</small><strong id="kPri">0</strong></div><div class="card"><small>Conduzidos</small><strong id="kCon">0</strong></div><div class="card"><small>Orientações</small><strong id="kOri">0</strong></div></section>
<section class="charts" style="margin-top:16px"><div class="chart"><h3>Tipos de ocorrências/crimes</h3><div id="gCrime" class="bars"></div></div><div class="chart"><h3>Comandantes</h3><div id="gCmd" class="bars"></div></div><div class="chart"><h3>Bairros/localidades</h3><div id="gBairro" class="bars"></div></div><div class="chart"><h3>Dias da semana</h3><div id="gDia" class="bars"></div></div><div class="chart"><h3>Turnos</h3><div id="gTurno" class="bars"></div></div><div class="chart"><h3>Motivos das demandas reprimidas</h3><div id="gMotivo" class="bars"></div></div></section>
<section class="box" style="margin-top:16px"><h3>Registros filtrados</h3><div class="scroll"><table><thead><tr><th>Data</th><th>BO</th><th>Ocorrência/Crime</th><th>Situação</th><th>Comandante</th><th>Bairro</th></tr></thead><tbody id="linhas"></tbody></table></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://jppmhhukujigxupgskdk.supabase.co","sb_publishable_ZVnU35i2x9zwppQqYg7UYw_mzaT43aG");var todos=[];function iso(d){return d.toISOString().slice(0,10)}function n(v){return Number(v)||0}function rank(a,c){var m={};a.forEach(function(x){var k=(x[c]||"NÃO INFORMADO").toString().trim();m[k]=(m[k]||0)+1});return Object.entries(m).sort(function(x,y){return y[1]-x[1]}).slice(0,10)}function barras(id,it,red){var e=document.getElementById(id),max=it[0]?.[1]||1;e.innerHTML=it.length?it.map(function(x){return '<div class="barline"><span>'+x[0]+'</span><div class="track"><div class="fill '+(red?'red':'')+'" style="width:'+(x[1]*100/max)+'%"></div></div><b>'+x[1]+'</b></div>'}).join(""):'<p>Sem dados.</p>'}function soma(a,c){return a.reduce(function(s,x){return s+n(x[c])},0)}function aplicar(){var c=document.getElementById("crime").value.toLowerCase(),cmd=document.getElementById("cmd").value.toLowerCase(),mun=document.getElementById("mun").value.toLowerCase(),b=document.getElementById("bairro").value.toLowerCase(),st=document.getElementById("status").value,t=document.getElementById("turno").value;var a=todos.filter(function(x){return(!c||((x.crime||x.ocorrencia||"").toLowerCase().includes(c)))&&(!cmd||(x.comandante||"").toLowerCase().includes(cmd))&&(!mun||(x.municipio||"").toLowerCase().includes(mun))&&(!b||(x.bairro||"").toLowerCase().includes(b))&&(!st||x.status_atendimento===st)&&(!t||x.turno===t)});var at=a.filter(function(x){return x.status_atendimento!=="DEMANDA REPRIMIDA"}),rep=a.filter(function(x){return x.status_atendimento==="DEMANDA REPRIMIDA"});kTotal.textContent=a.length;kAt.textContent=at.length;kRep.textContent=rep.length;kPri.textContent=soma(a,"numero_prisoes");kCon.textContent=soma(a,"numero_conduzidos");kOri.textContent=soma(a,"orientacoes");barras("gCrime",rank(a,"crime"));barras("gCmd",rank(a,"comandante"));barras("gBairro",rank(a,"bairro"));var dias=["DOMINGO","SEGUNDA","TERÇA","QUARTA","QUINTA","SEXTA","SÁBADO"],dm={};a.forEach(function(x){var d=new Date(x.data_ocorrencia+"T12:00:00");dm[dias[d.getDay()]]=(dm[dias[d.getDay()]]||0)+1});barras("gDia",Object.entries(dm));barras("gTurno",rank(a,"turno"));barras("gMotivo",rank(rep,"motivo_repressao"),true);linhas.innerHTML=a.slice(0,300).map(function(x){return "<tr><td>"+(x.data_ocorrencia||"")+"</td><td>"+(x.numero_bo||"")+"</td><td>"+(x.crime||x.ocorrencia||"")+"</td><td>"+(x.status_atendimento||"ATENDIDA")+"</td><td>"+(x.comandante||"—")+"</td><td>"+(x.bairro||"—")+"</td></tr>"}).join("")}async function carregar(){var r=await db.rpc("obter_dados_dashboard",{data_inicio:ini.value||null,data_fim:fim.value||null});todos=r.data||[];aplicar()}document.querySelectorAll("[data-p]").forEach(function(bt){bt.onclick=function(){var h=new Date(),i=new Date(h),p=bt.dataset.p;if(p==="semana"){i.setDate(h.getDate()-(h.getDay()===0?6:h.getDay()-1))}else if(p==="mes"){i=new Date(h.getFullYear(),h.getMonth(),1)}else if(p==="trimestre"){i=new Date(h.getFullYear(),Math.floor(h.getMonth()/3)*3,1)}else if(p==="semestre"){i=new Date(h.getFullYear(),h.getMonth()<6?0:6,1)}else if(p==="ano"){i=new Date(h.getFullYear(),0,1)}ini.value=iso(i);fim.value=iso(h);carregar()}});aplicar.onclick=carregar;var h=new Date();ini.value=iso(new Date(h.getFullYear(),h.getMonth(),1));fim.value=iso(h);carregar();</script></body></html>
