          s=s.replace('if(companhia.value&&x.companhia!==companhia.value)return false;if(status.value', 'if(companhia.value&&x.companhia!==companhia.value)return false;if(municipioFiltro.value&&!norm(x.municipio).toLowerCase().includes(municipioFiltro.value.toLowerCase()))return false;if(status.value')

          antigo="function detalhesEntorpecentes(registros){let m={};registros.forEach(o=>{let itens=Array.isArray(o.entorpecentes_itens)?o.entorpecentes_itens:[];if(itens.length){itens.forEach(i=>{let tipo=norm(i.tipo),unidade=norm(i.unidade),k=tipo+'|'+unidade;m[k]=(m[k]||0)+num(i.quantidade)})}else{[['MACONHA','maconha'],['COCAÍNA','cocaina'],['PASTA BASE','pasta_base'],['CRACK','crack'],['SKANK','skank']].forEach(([tipo,c])=>{let q=num(o[c]);if(q)m[tipo+'|GRAMA (g)']=(m[tipo+'|GRAMA (g)']||0)+q})}});return Object.entries(m).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(([k,q])=>{let [tipo,unidade]=k.split('|');return[tipo+' — '+unidade,q]})}"
          novo="function normalizarTipoEntorpecente(v){let k=chaveOcorrencia(v);return k==='SKANK'?'SKUNK':norm(v)}function tiposEntorpecentesOcorrencia(o){let s=new Set(),itens=Array.isArray(o.entorpecentes_itens)?o.entorpecentes_itens:[];itens.forEach(i=>{if(num(i.quantidade)>0&&i.tipo)s.add(normalizarTipoEntorpecente(i.tipo))});[['MACONHA','maconha'],['COCAÍNA','cocaina'],['PASTA BASE','pasta_base'],['CRACK','crack'],['SKUNK','skank']].forEach(([tipo,c])=>{if(num(o[c])>0)s.add(tipo)});if(!s.size&&norm(o.entorpecentes)==='SIM')s.add('TIPO NÃO INFORMADO');return [...s]}function temEntorpecente(o){return tiposEntorpecentesOcorrencia(o).length>0}function incidenciaEntorpecentes(registros){let m={};registros.forEach(o=>tiposEntorpecentesOcorrencia(o).forEach(tipo=>m[tipo]=(m[tipo]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}function materiaisEntorpecentes(registros){let m={};registros.forEach(o=>(Array.isArray(o.entorpecentes_itens)?o.entorpecentes_itens:[]).forEach(i=>{let tipo=normalizarTipoEntorpecente(i.tipo),forma=norm(i.forma_apresentacao||i.forma||i.unidade);if(!tipo||!forma||num(i.quantidade)<=0)return;let k=tipo+'|'+forma;m[k]=(m[k]||0)+num(i.quantidade)}));return Object.entries(m).map(([k,q])=>{let[tipo,forma]=k.split('|');return[tipo,forma,q]}).sort((a,b)=>a[0].localeCompare(b[0])||b[2]-a[2])}function detalhesEntorpecentes(registros){return materiaisEntorpecentes(registros).map(x=>[x[0]+' — '+x[1],x[2]])}"
