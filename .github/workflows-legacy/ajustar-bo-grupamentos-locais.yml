name: Ajustar BO, grupamentos e locais rápidos

on:
  push:
    paths:
      - '.github/workflows/ajustar-bo-grupamentos-locais.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajustar cadastro, consulta, dashboard e relatório
        shell: python
        run: |
          from pathlib import Path
          import re

          # ---------------- cadastro-base.html ----------------
          p=Path('cadastro-base.html')
          s=p.read_text(encoding='utf-8')

          if '.selecao-grupamento' not in s:
              alvo='.resultado-opcao input { width:18px; height:18px; margin:0; flex:none; accent-color:#2563eb; }'
              novo=alvo+'\n    .selecao-grupamento{display:flex;gap:10px;flex-wrap:wrap}.selecao-grupamento .resultado-opcao{min-width:190px}.locais-rapidos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.local-rapido{background:#eef5ff;color:#1d4ed8;border:1px solid #bfdbfe;padding:8px 12px;font-size:13px;font-weight:800}.local-rapido:hover{background:#dbeafe;color:#1e3a8a}'
              if alvo not in s: raise SystemExit('CSS de resultados não encontrado')
              s=s.replace(alvo,novo,1)

          padrao_tipo=re.compile(r'''<div class="campo">\s*<label for="tipoRegistro">Tipo \*</label>\s*<select id="tipoRegistro" name="tipoRegistro" required>[\s\S]*?</select>\s*</div>''')
          bloco_tipo='''<div class="campo">
            <label>Tipo de documento</label>
            <input id="tipoDocumentoExibicao" type="text" value="BO" readonly aria-label="Tipo de documento BO">
            <select id="tipoRegistro" name="tipoRegistro" required hidden>
              <option value="BO" selected>BO</option>
              <option value="TS">TÁTICO SETORIAL</option>
              <option value="AME">AME</option>
              <option>ROP</option>
              <option>TCO</option>
            </select>
            <span class="nota">Toda ocorrência operacional é registrada por Boletim de Ocorrência (BO).</span>
          </div>

          <div class="campo duplo">
            <label>Guarnição especializada</label>
            <div class="selecao-grupamento">
              <label class="resultado-opcao"><input id="grupamentoTatico" type="checkbox"> TÁTICO SETORIAL</label>
              <label class="resultado-opcao"><input id="grupamentoAme" type="checkbox"> AME</label>
            </div>
            <span class="nota">Marque somente quando o BO tiver sido atendido por um desses grupamentos. As opções são exclusivas.</span>
          </div>'''
          if 'id="grupamentoTatico"' not in s:
              s,n=padrao_tipo.subn(bloco_tipo,s,count=1)
              if n!=1: raise SystemExit('Bloco de tipo de registro não encontrado')

          bloco_local='''<div class="campo duplo">
            <label for="localEntrega">Local de entrega do relatório</label>
            <div class="campo-com-acao"><input id="localEntrega" name="localEntrega" type="text" list="listaLocais" autocomplete="off" placeholder="Digite para pesquisar e selecione"><button class="botao-adicionar" id="abrirNovoLocalEntrega" type="button" title="Cadastrar novo local de entrega" aria-label="Cadastrar novo local de entrega">+</button></div><datalist id="listaLocais"></datalist>
          </div>'''
          novo_local='''<div class="campo duplo">
            <label for="localEntrega">Local de entrega do relatório</label>
            <div class="campo-com-acao"><input id="localEntrega" name="localEntrega" type="text" list="listaLocais" autocomplete="off" placeholder="Digite para pesquisar e selecione"><button class="botao-adicionar" id="abrirNovoLocalEntrega" type="button" title="Cadastrar novo local de entrega" aria-label="Cadastrar novo local de entrega">+</button></div><datalist id="listaLocais"></datalist>
            <div class="locais-rapidos" aria-label="Locais de entrega mais utilizados">
              <button class="local-rapido" type="button" data-local-rapido="PC II">PC II</button>
              <button class="local-rapido" type="button" data-local-rapido="4 DP">4º DP</button>
              <button class="local-rapido" type="button" data-local-rapido="PC I">PC I</button>
            </div>
            <span class="nota">Atalhos baseados nos locais mais utilizados na planilha oficial de 2026.</span>
          </div>'''
          if 'data-local-rapido="PC II"' not in s:
              if bloco_local not in s: raise SystemExit('Bloco de local de entrega não encontrado')
              s=s.replace(bloco_local,novo_local,1)

          if 'function sincronizarGrupamentoComTipo()' not in s:
              alvo='''    const idEdicao = new URLSearchParams(location.search).get("id");
    let registroOriginalEdicao = null;'''
              novo='''    const idEdicao = new URLSearchParams(location.search).get("id");
    let registroOriginalEdicao = null;
    const grupamentoTatico = document.getElementById("grupamentoTatico");
    const grupamentoAme = document.getElementById("grupamentoAme");
    function sincronizarGrupamentoComTipo(origem=null) {
      const tipo=document.getElementById("tipoRegistro");
      if (origem) {
        const bruto=String(origem.tipo_registro||"").trim().toUpperCase();
        const grupo=String(origem.grupamento_atendimento||"").trim().toUpperCase();
        grupamentoTatico.checked = Boolean(origem.tatico_setorial) || bruto === "TS" || bruto.includes("TÁTICO") || bruto.includes("TATICO") || grupo.includes("TÁTICO") || grupo.includes("TATICO");
        grupamentoAme.checked = bruto === "AME" || grupo === "AME";
        if (grupamentoTatico.checked) grupamentoAme.checked=false;
      }
      if (grupamentoTatico.checked) tipo.value="TS";
      else if (grupamentoAme.checked) tipo.value="AME";
      else if (!idEdicao || !["ROP","TCO"].includes(String(tipo.value||"").toUpperCase())) tipo.value="BO";
    }
    grupamentoTatico.addEventListener("change",()=>{if(grupamentoTatico.checked)grupamentoAme.checked=false;sincronizarGrupamentoComTipo()});
    grupamentoAme.addEventListener("change",()=>{if(grupamentoAme.checked)grupamentoTatico.checked=false;sincronizarGrupamentoComTipo()});
    document.querySelectorAll("[data-local-rapido]").forEach(btn=>btn.addEventListener("click",()=>{document.getElementById("localEntrega").value=btn.dataset.localRapido||"";}));
    sincronizarGrupamentoComTipo();'''
              if alvo not in s: raise SystemExit('idEdicao não encontrado')
              s=s.replace(alvo,novo,1)

          alvo='''      Object.keys(mapa).forEach(k => definirCampo(mapa[k],x[k]));
      carregarItensEstruturados(x);'''
          if 'sincronizarGrupamentoComTipo(x);' not in s:
              novo='''      Object.keys(mapa).forEach(k => definirCampo(mapa[k],x[k]));
      sincronizarGrupamentoComTipo(x);
      carregarItensEstruturados(x);'''
              if alvo not in s: raise SystemExit('Carregamento de edição não encontrado')
              s=s.replace(alvo,novo,1)

          if '["comandante","Informe o comandante da viatura."]' not in s:
              alvo='''        ["horaInicial","Informe a hora inicial."],
        ["ocorrencia","Selecione o Tipo de Ocorrência."]
      ];'''
              novo='''        ["horaInicial","Informe a hora inicial."],
        ["comandante","Informe o comandante da viatura."],
        ["ocorrencia","Selecione o Tipo de Ocorrência."]
      ];'''
              if alvo not in s: raise SystemExit('Validação do novo cadastro não encontrada')
              s=s.replace(alvo,novo,1)

          p.write_text(s,encoding='utf-8')

          # ---------------- cadastro.html ----------------
          p=Path('cadastro.html');s=p.read_text(encoding='utf-8')
          s=s.replace('cadastro-base.html?v=20260823-3','cadastro-base.html?v=20260824-1')
          s=s.replace('// Novos cadastros: somente BO, Tático Setorial e AME.','// Novos cadastros: documento BO; Tático Setorial e AME são grupamentos.')
          p.write_text(s,encoding='utf-8')

          # ---------------- dashboard.html ----------------
          p=Path('dashboard.html');s=p.read_text(encoding='utf-8')
          antigo='<label>Tipo de documento/equipe<select id="documento"><option value="">Todos</option><option>BO</option><option>TCO</option><option>ROP</option><option value="TS">TÁTICO SETORIAL</option><option value="AME">AME</option></select></label>'
          novo='<label>Tipo de documento<select id="documento"><option value="">Todos</option><option>BO</option><option>TCO</option><option>ROP</option></select></label><label>Grupamento<select id="grupamento"><option value="">Todos</option><option value="TÁTICO SETORIAL">TÁTICO SETORIAL</option><option value="AME">AME</option></select></label>'
          if antigo in s:s=s.replace(antigo,novo,1)
          elif 'id="grupamento"' not in s: raise SystemExit('Filtro documento do dashboard não encontrado')

          if 'function tipoDocumentoRegistro(' not in s:
              marcador='function classeVariacao(nome,a,b)'
              helpers='''function tipoDocumentoRegistro(x){let k=chaveOcorrencia(x?.tipo_registro);return (k==='TS'||k==='AME'||k==='TATICO SETORIAL'||k==='TÁTICO SETORIAL')?'BO':norm(x?.tipo_registro)}function grupamentoRegistro(x){let g=chaveOcorrencia(x?.grupamento_atendimento);if(g==='AME')return 'AME';if(g==='TATICO SETORIAL'||g==='TÁTICO SETORIAL')return 'TÁTICO SETORIAL';let k=chaveOcorrencia(x?.tipo_registro);if(k==='AME')return 'AME';if(k==='TS'||k==='TATICO SETORIAL'||k==='TÁTICO SETORIAL'||x?.tatico_setorial===true)return 'TÁTICO SETORIAL';return ''}'''
              if marcador not in s: raise SystemExit('Marcador de helpers dashboard não encontrado')
              s=s.replace(marcador,helpers+marcador,1)
          s=s.replace('if(documento.value&&x.tipo_registro!==documento.value)return false;','if(documento.value&&tipoDocumentoRegistro(x)!==documento.value)return false;if(grupamento.value&&grupamentoRegistro(x)!==grupamento.value)return false;',1)
          s=s.replace("if(documento.value&&documento.value!=='TCO')return false;","if(documento.value&&documento.value!=='TCO')return false;if(grupamento.value)return false;",1)
          s=s.replace("function docsComTco(registros,tcos){let m=Object.fromEntries(rank(registros,'tipo_registro'));m.TCO=(m.TCO||0)+tcos.length;return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}","function docsComTco(registros,tcos){let m=Object.fromEntries(rank(registros,x=>tipoDocumentoRegistro(x)));m.TCO=(m.TCO||0)+tcos.length;return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}",1)
          s=s.replace('BO, TCO, ROP e demais documentos do período','BO, TCO e documentos legados do período')
          p.write_text(s,encoding='utf-8')

          # ---------------- relatorio.html ----------------
          p=Path('relatorio.html');s=p.read_text(encoding='utf-8')
          if 'function tipoDocumentoRel(' not in s:
              marcador='function iso(d)'
              helper="function tipoDocumentoRel(x){let k=S(x?.tipo_registro).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase();return (k==='TS'||k==='AME'||k==='TATICO SETORIAL')?'BO':S(x?.tipo_registro)||'NÃO INFORMADO'}\n"
              if marcador not in s: raise SystemExit('Marcador relatório não encontrado')
              s=s.replace(marcador,helper+marcador,1)
          s=s.replace("function docsComTco(registros,tcos){let m=Object.fromEntries(rank(registros,'tipo_registro'));m.TCO=(m.TCO||0)+tcos.length;return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}","function docsComTco(registros,tcos){let m=Object.fromEntries(rank(registros,x=>tipoDocumentoRel(x)));m.TCO=(m.TCO||0)+tcos.length;return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}",1)
          p.write_text(s,encoding='utf-8')

          # ---------------- consulta.html ----------------
          p=Path('consulta.html');s=p.read_text(encoding='utf-8')
          s=s.replace('<th>Data</th><th>Tipo</th><th>Nº BO</th>','<th>Data</th><th>Documento</th><th>Grupamento</th><th>Nº BO</th>',1)
          s=s.replace('colspan="7"','colspan="8"')
          if 'function tipoDocumentoConsulta(' not in s:
              marcador='    function renderTcos(item) {'
              helper='''    function tipoDocumentoConsulta(item) {
      const k=String(item?.tipo_registro||'').trim().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase();
      return ['TS','AME','TATICO SETORIAL'].includes(k) ? 'BO' : (item?.tipo_registro || '—');
    }
    function grupamentoConsulta(item) {
      const g=String(item?.grupamento_atendimento||'').trim(); if (g) return g;
      const k=String(item?.tipo_registro||'').trim().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase();
      if (k==='AME') return 'AME';
      if (k==='TS'||k==='TATICO SETORIAL'||item?.tatico_setorial===true) return 'TÁTICO SETORIAL';
      return '—';
    }
'''
              if marcador not in s: raise SystemExit('Marcador consulta não encontrado')
              s=s.replace(marcador,helper+marcador,1)
          s=s.replace('const botaoTco = item.tipo_registro === "BO"','const botaoTco = tipoDocumentoConsulta(item) === "BO"',1)
          s=s.replace('escapar(item.tipo_registro || "—") + "</td><td>" + escapar(item.numero_bo)', 'escapar(tipoDocumentoConsulta(item)) + "</td><td>" + escapar(grupamentoConsulta(item)) + "</td><td>" + escapar(item.numero_bo)',1)
          s=s.replace('href=\\"cadastro-base.html?id=', 'href=\\"cadastro.html?id=',1)
          p.write_text(s,encoding='utf-8')

      - name: Validar
        shell: bash
        run: |
          grep -q 'id="grupamentoTatico"' cadastro-base.html
          grep -q 'data-local-rapido="PC II"' cadastro-base.html
          grep -q 'data-local-rapido="4 DP"' cadastro-base.html
          grep -q 'data-local-rapido="PC I"' cadastro-base.html
          grep -q 'id="grupamento"' dashboard.html
          grep -q 'tipoDocumentoRegistro' dashboard.html
          grep -q 'tipoDocumentoRel' relatorio.html
          grep -q 'grupamentoConsulta' consulta.html
          grep -q 'cadastro.html?id=' consulta.html

      - name: Publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cadastro-base.html cadastro.html dashboard.html relatorio.html consulta.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "Separa BO de grupamentos e adiciona locais rápidos"
          git push
