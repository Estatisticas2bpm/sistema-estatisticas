name: Corrigir lógica de entorpecentes

on:
  push:
    paths:
      - '.github/workflows/corrigir-logica-entorpecentes.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir cadastro, dashboard e relatório
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, nome):
              if old not in text:
                  raise SystemExit(f'Trecho não encontrado em {nome}: {old[:120]}')
              return text.replace(old, new, 1)

