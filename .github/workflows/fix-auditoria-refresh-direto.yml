name: Corrigir releitura direta da Auditoria

on:
  push:
    paths:
      - '.github/workflows/fix-auditoria-refresh-direto.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajustar auditoria
        shell: python
        run: |
          from pathlib import Path

          p = Path('auditoria.html')
          s = p.read_text(encoding='utf-8')

          old = "let id=await localizarOcorrenciaParaEdicao(o),ret='auditoria.html?ini='+encodeURIComponent($('ini').value)+'&fim='+encodeURIComponent($('fim').value)+'&filtro='+encodeURIComponent($('filtro').value)+'&corrigido='+encodeURIComponent(o.numero_bo||'');location.href='cadastro.html?id='+encodeURIComponent(id)+'&retorno='+encodeURIComponent(ret)"
          new = "let id=await localizarOcorrenciaParaEdicao(o),ret='auditoria.html?ini='+encodeURIComponent($('ini').value)+'&fim='+encodeURIComponent($('fim').value)+'&filtro='+encodeURIComponent($('filtro').value)+'&corrigido='+encodeURIComponent(o.numero_bo||'')+'&corrigido_id='+encodeURIComponent(id);location.href='cadastro.html?id='+encodeURIComponent(id)+'&retorno='+encodeURIComponent(ret)"
          if old not in s:
              raise SystemExit('Trecho do retorno da auditoria não encontrado')
          s = s.replace(old, new, 1)

          old2 = "dados=(rr[0].data||[]).map(o=>{let g=porId.get(String(o.id))||porBo.get(chave(o.numero_bo)+'|'+String(o.data_ocorrencia||'')),latV=!vazio(o.latitude),lngV=!vazio(o.longitude);return {...o,__geo_ok:Boolean(g)||(!rr[1].error&&coordenadaValida(o)),__geo_parcial:!g&&(latV!==lngV)}});render();"
          new2 = "dados=(rr[0].data||[]).map(o=>{let g=porId.get(String(o.id))||porBo.get(chave(o.numero_bo)+'|'+String(o.data_ocorrencia||'')),latV=!vazio(o.latitude),lngV=!vazio(o.longitude);return {...o,__geo_ok:Boolean(g)||coordenadaValida(o),__geo_parcial:!g&&(latV!==lngV)}});\n const corrigidoId=new URLSearchParams(location.search).get('corrigido_id');\n if(corrigidoId){\n   const direto=await db.rpc('obter_ocorrencia_publica',{p_id:corrigidoId});\n   if(!direto.error&&direto.data){\n     const x=direto.data,latV=!vazio(x.latitude),lngV=!vazio(x.longitude),atual={...x,__geo_ok:coordenadaValida(x),__geo_parcial:latV!==lngV};\n     const idx=dados.findIndex(o=>String(o.id)===String(corrigidoId));\n     if(idx>=0) dados[idx]={...dados[idx],...atual};\n     else dados.push(atual);\n   }\n }\n render();"
          if old2 not in s:
              raise SystemExit('Trecho de carregamento da auditoria não encontrado')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')

      - name: Validar
        run: |
          grep -q "corrigido_id" auditoria.html
          grep -q "obter_ocorrencia_publica" auditoria.html
          grep -q "__geo_ok:coordenadaValida(x)" auditoria.html

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria.html
          git commit -m "Relê ocorrência corrigida diretamente na Auditoria"
          git push
