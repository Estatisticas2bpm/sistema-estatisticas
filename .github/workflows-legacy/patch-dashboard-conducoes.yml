name: Dashboard somente com conduções
on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-conducoes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="card amber"><small>Prisões</small><strong id="kPrisoes">0</strong></div><div class="card steel"><small>Conduzidos</small><strong id="kConduzidos">0</strong></div>','<div class="card steel"><small>Conduções</small><strong id="kConduzidos">0</strong><em>inclui compatibilidade com registros legados</em></div>')
          s=s.replace("kDocumentos.textContent=a.length+ta.length;kPrisoes.textContent=soma(a,'numero_prisoes');kConduzidos.textContent=soma(a,'numero_conduzidos');","kDocumentos.textContent=a.length+ta.length;kConduzidos.textContent=soma(a,'conducoes_operacionais');")
          s=s.replace("let pro=[['Prisões','numero_prisoes','amber'],['Conduzidos','numero_conduzidos','steel'],","let pro=[['Conduções','conducoes_operacionais','steel'],")
          s=s.replace('Prisões','Conduções').replace('PRISÕES','CONDUÇÕES')
          if "soma(a,'conducoes_operacionais')" not in s:
              raise SystemExit('Métrica consolidada não foi aplicada')
          if 'kPrisoes' in s:
              raise SystemExit('Card antigo de prisões ainda existe')
          p.write_text(s,encoding='utf-8')
      - name: Validar
        run: |
          grep -q 'conducoes_operacionais' dashboard.html
          ! grep -q 'kPrisoes' dashboard.html
          ! grep -qi 'prisões' dashboard.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          git diff --cached --quiet || (git commit -m "Consolida produtividade em conduções" && git push)
