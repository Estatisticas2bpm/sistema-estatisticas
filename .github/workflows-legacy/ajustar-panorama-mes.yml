name: Ajustar panorama do mês

on:
  push:
    paths:
      - '.github/workflows/ajustar-panorama-mes.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mostrar somente o nome do mês no panorama
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css='.hero p{margin:0;color:#c5d6e6;font-size:16px}'
          css_novo='.hero p{margin:0;color:#c5d6e6;font-size:16px}#periodoSemana{margin-top:8px;color:#9ee5e7;font-size:20px;font-weight:800;letter-spacing:.4px;text-transform:none}'
          if css not in s:
            raise SystemExit('CSS do período não encontrado')
          s=s.replace(css,css_novo,1)

          antigo='periodoSemana.textContent=fmt(inicio)+" a "+fmt(fim);'
          novo='var nomeMes=hoje.toLocaleDateString("pt-BR",{month:"long"});periodoSemana.textContent=nomeMes.charAt(0).toUpperCase()+nomeMes.slice(1);'
          if antigo not in s:
            raise SystemExit('Lógica antiga do período não encontrada')
          s=s.replace(antigo,novo,1)

          p.write_text(s,encoding='utf-8')

      - name: Validar
        run: |
          grep -q 'toLocaleDateString("pt-BR",{month:"long"})' index.html
          grep -q '#periodoSemana' index.html

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Exibe nome do mês no panorama operacional"
          git push
