name: Relatório somente com conduções
on:
  push:
    paths:
      - '.github/workflows/patch-relatorio-conducoes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('relatorio.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Auto de Resistência / Prisão','Auto de Resistência')
          s=s.replace('AUTO DE RESISTÊNCIA / PRISÃO','AUTO DE RESISTÊNCIA')
          s=s.replace('AUTO DE RESISTÊNCIA E PRISÃO','AUTO DE RESISTÊNCIA')
          s=s.replace("['PRISÕES',sum(d,'numero_prisoes')],['Nº DE CONDUZIDOS',sum(d,'numero_conduzidos')],","['CONDUÇÕES',sum(d,'conducoes_operacionais')],")
          s=s.replace("['PRISÕES',sum(d,'numero_prisoes'),sum(old,'numero_prisoes')],['CONDUZIDOS',sum(d,'numero_conduzidos'),sum(old,'numero_conduzidos')],","['CONDUÇÕES',sum(d,'conducoes_operacionais'),sum(old,'conducoes_operacionais')],")
          s=s.replace("['PRISÕES',sum(d,'numero_prisoes'),sum(old,'numero_prisoes')],",'')
          s=s.replace("['CONDUZIDOS',sum(d,'numero_conduzidos'),sum(old,'numero_conduzidos')],","['CONDUÇÕES',sum(d,'conducoes_operacionais'),sum(old,'conducoes_operacionais')],")
          s=s.replace('PRISÕES','CONDUÇÕES')
          if 'CONDUÇÕES' not in s:
              raise SystemExit('Indicador de conduções não encontrado')
          p.write_text(s,encoding='utf-8')
      - name: Validar
        run: |
          grep -q 'CONDUÇÕES' relatorio.html
          ! grep -q 'PRISÕES' relatorio.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorio.html
          git diff --cached --quiet || (git commit -m "Atualiza relatório para conduções" && git push)
