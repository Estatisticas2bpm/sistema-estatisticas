name: Aplicar correção de edição legada

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  corrigir:
    if: github.event.pull_request.head.ref == 'trigger-edicao-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Corrigir cadastro.html
        shell: python
        run: |
          from pathlib import Path

          p = Path('cadastro.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<form id="formOcorrencia">', '<form id="formOcorrencia" novalidate>', 1)

          marcador = '''    formulario.addEventListener("submit", async (evento) => {\n      evento.preventDefault();\n      const botaoSalvar = formulario.querySelector('button[type="submit"]');'''
          novo = '''    function mostrarErroCampo(id, mensagem) {\n      const el = document.getElementById(id);\n      alert(mensagem);\n      if (el) {\n        el.scrollIntoView({behavior:"smooth",block:"center"});\n        setTimeout(()=>el.focus(),250);\n      }\n      return false;\n    }\n\n    function validarFormularioPrincipal() {\n      const obrigatorios = idEdicao ? [\n        ["data","Informe a data da ocorrência."],\n        ["numeroBo","Informe o número do BO/ROP."],\n        ["ocorrencia","Selecione o Tipo de Ocorrência."]\n      ] : [\n        ["data","Informe a data da ocorrência."],\n        ["statusAtendimento","Informe a situação da ocorrência."],\n        ["municipio","Informe o município."],\n        ["tipoRegistro","Selecione o tipo de registro."],\n        ["numeroBo","Informe o número do BO/ROP."],\n        ["horaInicial","Informe a hora inicial."],\n        ["ocorrencia","Selecione o Tipo de Ocorrência."]\n      ];\n      for (const [id,msg] of obrigatorios) {\n        const el=document.getElementById(id);\n        if (!el || !String(el.value||"").trim()) return mostrarErroCampo(id,msg);\n      }\n      if (document.getElementById("resultadoConducao").checked && !Number(document.getElementById("numeroConduzidos").value)) return mostrarErroCampo("numeroConduzidos","Informe a quantidade de conduzidos.");\n      if (document.getElementById("resultadoOrientacao").checked && !Number(document.getElementById("orientacoes").value)) return mostrarErroCampo("orientacoes","Informe a quantidade de orientações.");\n      if (document.getElementById("resultadoVeiculo").checked && !Number(document.getElementById("veiculosRecuperados").value)) return mostrarErroCampo("veiculosRecuperados","Informe a quantidade de veículos recuperados.");\n      if (document.getElementById("resultadoOutro").checked && !document.getElementById("outroResultadoDescricao").value.trim()) return mostrarErroCampo("outroResultadoDescricao","Descreva o outro resultado do atendimento.");\n      return true;\n    }\n\n    formulario.addEventListener("submit", async (evento) => {\n      evento.preventDefault();\n      if (!validarFormularioPrincipal()) return;\n      const botaoSalvar = formulario.querySelector('button[type="submit"]');'''
          if marcador in s and 'function validarFormularioPrincipal()' not in s:
              s = s.replace(marcador, novo, 1)

          antigo = '''      const tipoEscolhido = catalogos.tipos.find(t => t.nome === document.getElementById("ocorrencia").value);\n      if (!tipoEscolhido) { alert("Selecione um Tipo de Ocorrência válido na lista."); return; }\n      const subtipoDigitado = document.getElementById("crime").value;\n      if (subtipoDigitado && !catalogos.subtipos.some(s => Number(s.tipo_id) === Number(tipoEscolhido.id) && s.nome === subtipoDigitado)) { alert("Selecione um Subtipo válido relacionado à ocorrência."); return; }'''
          novo = '''      const valorOcorrencia = normalizarCatalogo(document.getElementById("ocorrencia").value);\n      let tipoEscolhido = catalogos.tipos.find(t => normalizarCatalogo(t.nome) === valorOcorrencia);\n      const ocorrenciaOriginal = normalizarCatalogo(registroOriginalEdicao && registroOriginalEdicao.ocorrencia);\n      const ocorrenciaAlterada = !idEdicao || valorOcorrencia !== ocorrenciaOriginal;\n      if (!tipoEscolhido && ocorrenciaAlterada) return mostrarErroCampo("ocorrencia","Selecione um Tipo de Ocorrência válido na lista.");\n      if (tipoEscolhido) document.getElementById("ocorrencia").value = tipoEscolhido.nome;\n      const subtipoDigitado = document.getElementById("crime").value;\n      const subtipoOriginal = normalizarCatalogo(registroOriginalEdicao && registroOriginalEdicao.crime);\n      const subtipoAlterado = !idEdicao || normalizarCatalogo(subtipoDigitado) !== subtipoOriginal;\n      if (subtipoDigitado && subtipoAlterado && (!tipoEscolhido || !catalogos.subtipos.some(s => Number(s.tipo_id) === Number(tipoEscolhido.id) && normalizarCatalogo(s.nome) === normalizarCatalogo(subtipoDigitado)))) return mostrarErroCampo("crime","Selecione um Subtipo válido relacionado à ocorrência.");'''
          if antigo in s:
              s = s.replace(antigo, novo, 1)

          antigo = '''      const comandanteDigitado = normalizarComandante(campoComandante.value);\n      if (comandanteDigitado && !catalogos.comandantes.includes(comandanteDigitado)) { alert("Selecione um comandante válido na lista ou use o botão + para cadastrá-lo."); return; }\n      campoComandante.value = comandanteDigitado;'''
          novo = '''      const comandanteDigitado = normalizarComandante(campoComandante.value);\n      const comandanteOriginal = normalizarComandante(registroOriginalEdicao && registroOriginalEdicao.comandante);\n      const comandanteAlterado = !idEdicao || comandanteDigitado !== comandanteOriginal;\n      if (comandanteDigitado && comandanteAlterado && !catalogos.comandantes.includes(comandanteDigitado)) return mostrarErroCampo("comandante","Selecione um comandante válido na lista ou use o botão + para cadastrá-lo.");\n      campoComandante.value = comandanteDigitado;'''
          if antigo in s:
              s = s.replace(antigo, novo, 1)

          antigo = '''      const localEntregaDigitado = padronizarLocalEntrega(document.getElementById("localEntrega").value);\n      if (localEntregaDigitado && !catalogos.locais.includes(localEntregaDigitado)) { alert("Selecione um Local de entrega válido na lista padronizada."); return; }\n      document.getElementById("localEntrega").value = localEntregaDigitado;'''
          novo = '''      const localEntregaDigitado = padronizarLocalEntrega(document.getElementById("localEntrega").value);\n      const localEntregaOriginal = padronizarLocalEntrega(registroOriginalEdicao && registroOriginalEdicao.local_entrega);\n      const localEntregaAlterado = !idEdicao || localEntregaDigitado !== localEntregaOriginal;\n      if (localEntregaDigitado && localEntregaAlterado && !catalogos.locais.includes(localEntregaDigitado)) return mostrarErroCampo("localEntrega","Selecione um Local de entrega válido na lista padronizada.");\n      document.getElementById("localEntrega").value = localEntregaDigitado;'''
          if antigo in s:
              s = s.replace(antigo, novo, 1)

          antigo = '''      const bairroDigitado = normalizarCatalogo(document.getElementById("bairro").value);\n      if (!bairroDigitado) { alert("Informe o bairro da ocorrência. Se o Google Maps não identificar corretamente, preencha o campo manualmente."); return; }\n      document.getElementById("bairro").value = bairroDigitado;'''
          novo = '''      const bairroDigitado = normalizarCatalogo(document.getElementById("bairro").value);\n      const bairroOriginal = normalizarCatalogo(registroOriginalEdicao && registroOriginalEdicao.bairro);\n      const bairroAlterado = !idEdicao || bairroDigitado !== bairroOriginal;\n      if (!bairroDigitado && bairroAlterado) return mostrarErroCampo("bairro","Informe o bairro da ocorrência. Se o Google Maps não identificar corretamente, preencha o campo manualmente.");\n      document.getElementById("bairro").value = bairroDigitado;'''
          if antigo in s:
              s = s.replace(antigo, novo, 1)

          s = s.replace('''      if ((!enderecoAtual || !document.getElementById("latitude").value || !document.getElementById("longitude").value) && enderecoFoiAlterado) { alert("O endereço foi alterado. Pesquise e selecione uma sugestão do Google Maps antes de salvar."); return; }''', '''      if ((!enderecoAtual || !document.getElementById("latitude").value || !document.getElementById("longitude").value) && enderecoFoiAlterado) return mostrarErroCampo("enderecoGoogle","O endereço foi alterado. Pesquise e selecione uma sugestão do Google Maps antes de salvar.");''', 1)

          s = s.replace('''      } finally {\n        botaoSalvar.disabled = false;\n        botaoSalvar.textContent = "Salvar ocorrência";\n      }''', '''      } finally {\n        botaoSalvar.disabled = false;\n        botaoSalvar.textContent = textoOriginalBotao;\n      }''', 1)

          p.write_text(s, encoding='utf-8')

      - name: Validar patch
        run: |
          grep -q 'formOcorrencia" novalidate' cadastro.html
          grep -q 'function validarFormularioPrincipal' cadastro.html
          grep -q 'ocorrenciaAlterada' cadastro.html
          grep -q 'comandanteAlterado' cadastro.html
          grep -q 'localEntregaAlterado' cadastro.html
          grep -q 'bairroAlterado' cadastro.html
          grep -q 'botaoSalvar.textContent = textoOriginalBotao' cadastro.html

      - name: Publicar no main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cadastro.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
          else
            git commit -m "Corrige edição de ocorrências antigas"
            git push origin main
          fi
