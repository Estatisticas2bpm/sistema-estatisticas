<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carregando cadastro...</title>
  <style>body{margin:0;background:#eef2f6;font:15px Arial,sans-serif;color:#334155;display:grid;place-items:center;min-height:100vh}.loading{background:#fff;padding:24px 30px;border-radius:12px;box-shadow:0 4px 16px #0001;font-weight:700}</style>
</head>
<body><div class="loading">Carregando cadastro...</div>
<script>
(async function(){
  try {
    const resposta=await fetch('cadastro-base.html?v=20260824-3',{cache:'no-store'});
    if(!resposta.ok) throw new Error('Falha ao carregar a base do cadastro.');
    let html=await resposta.text();

    // Novos cadastros: o documento é sempre BO. ROP/TCO ficam somente para compatibilidade histórica.
    html=html.replaceAll('<option>ROP</option>','');
    html=html.replaceAll('<option>TCO</option>','');

    // NI deixa de ser uma opção de preenchimento em toda a tela de cadastro.
    html=html.replaceAll('<option>NI — Não Informado</option>','');
    html=html.replaceAll('<option value="NI">NI — Não Informado</option>','');

    // A rotina atual trabalha com número de BO.
    html=html.replaceAll('Nº BO/ROP *','Nº BO *');
    html=html.replaceAll('Informe o número do BO/ROP.','Informe o número do BO.');

    // Tipo de documento visível = BO. Tático Setorial e AME passam a ser grupamentos.
    // As opções históricas permanecem no select oculto apenas para preservar ROP/TCO antigos em edição.
    html=html.replace(
      /<div class="campo">\s*<label for="tipoRegistro">Tipo \*<\/label>\s*<select id="tipoRegistro" name="tipoRegistro" required>[\s\S]*?<\/select>\s*<\/div>/,
      '<div class="campo"><label>Tipo de documento</label><input id="tipoDocumentoExibicao" type="text" value="BO" readonly aria-label="Tipo de documento"><select id="tipoRegistro" name="tipoRegistro" required hidden><option value="BO" selected>BO</option><option value="ROP">ROP</option><option value="TCO">TCO</option><option value="NI">NI</option></select><span class="nota">Nos novos registros, toda ocorrência operacional é registrada por Boletim de Ocorrência (BO).</span></div><div class="campo duplo"><label>Guarnição especializada</label><div class="selecao-grupamento" style="display:flex;gap:10px;flex-wrap:wrap"><label class="resultado-opcao" style="min-width:190px"><input id="grupamentoTatico" type="checkbox"> TÁTICO SETORIAL</label><label class="resultado-opcao" style="min-width:190px"><input id="grupamentoAme" type="checkbox"> AME</label></div><span class="nota">Marque somente quando o BO tiver sido atendido por um desses grupamentos. As opções são exclusivas.</span></div>'
    );

    // Atalhos para os três locais de entrega mais usados na planilha oficial de 2026.
    html=html.replace(
      '<div class="campo duplo">\n            <label for="localEntrega">Local de entrega do relatório</label>\n            <div class="campo-com-acao"><input id="localEntrega" name="localEntrega" type="text" list="listaLocais" autocomplete="off" placeholder="Digite para pesquisar e selecione"><button class="botao-adicionar" id="abrirNovoLocalEntrega" type="button" title="Cadastrar novo local de entrega" aria-label="Cadastrar novo local de entrega">+</button></div><datalist id="listaLocais"></datalist>\n          </div>',
      '<div class="campo duplo">\n            <label for="localEntrega">Local de entrega do relatório</label>\n            <div class="campo-com-acao"><input id="localEntrega" name="localEntrega" type="text" list="listaLocais" autocomplete="off" placeholder="Digite para pesquisar e selecione"><button class="botao-adicionar" id="abrirNovoLocalEntrega" type="button" title="Cadastrar novo local de entrega" aria-label="Cadastrar novo local de entrega">+</button></div><datalist id="listaLocais"></datalist>\n            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button type="button" data-local-rapido="PC II" style="background:#eef5ff;color:#1d4ed8;border:1px solid #bfdbfe;padding:8px 12px;font-size:13px;font-weight:800">PC II</button><button type="button" data-local-rapido="4 DP" style="background:#eef5ff;color:#1d4ed8;border:1px solid #bfdbfe;padding:8px 12px;font-size:13px;font-weight:800">4º DP</button><button type="button" data-local-rapido="PC I" style="background:#eef5ff;color:#1d4ed8;border:1px solid #bfdbfe;padding:8px 12px;font-size:13px;font-weight:800">PC I</button></div>\n            <span class="nota">Atalhos dos locais de entrega mais utilizados em 2026.</span>\n          </div>'
    );

    // Comandante é obrigatório em NOVOS cadastros.
    html=html.replace(
      '<label for="comandante">Comandante da viatura</label>',
      '<label for="comandante">Comandante da viatura *</label>'
    );
    html=html.replace(
      '["horaInicial","Informe a hora inicial."],\n        ["ocorrencia","Selecione o Tipo de Ocorrência."]',
      '["horaInicial","Informe a hora inicial."],\n        ["comandante","Informe o comandante da viatura."],\n        ["ocorrencia","Selecione o Tipo de Ocorrência."]'
    );

    // Separação semântica: tipo_registro fica BO e o grupamento é salvo dentro do
    // mesmo JSON estruturado já usado em observacao_final. Tático também mantém o
    // booleano legado tatico_setorial para compatibilidade com consultas antigas.
    html=html.replace(
      '    const idEdicao = new URLSearchParams(location.search).get("id");\n    let registroOriginalEdicao = null;',
      '    const idEdicao = new URLSearchParams(location.search).get("id");\n    let registroOriginalEdicao = null;\n    const grupamentoTatico = document.getElementById("grupamentoTatico");\n    const grupamentoAme = document.getElementById("grupamentoAme");\n    const tipoDocumentoExibicao = document.getElementById("tipoDocumentoExibicao");\n    function chaveTipoRegistro(v){return String(v||"").trim().normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").toUpperCase();}\n    function grupamentoSelecionado(){return grupamentoTatico.checked?"TÁTICO SETORIAL":grupamentoAme.checked?"AME":null;}\n    function extrairGrupamentoObservacao(valor){\n      const texto=String(valor||"");const pos=texto.indexOf(MARCADOR_PESSOAS);if(pos<0)return null;\n      try{return JSON.parse(texto.slice(pos+MARCADOR_PESSOAS.length)).grupamento_atendimento||null}catch(_){return null}\n    }\n    montarObservacaoFinal=function(){\n      const texto=document.getElementById("observacaoFinal").value.trim();\n      const dados={vitimas:pessoasAdicionais("vitima"),infratores:pessoasAdicionais("infrator"),envolvidos:pessoasAdicionais("envolvido"),grupamento_atendimento:grupamentoSelecionado()};\n      const temEstruturado=dados.vitimas.length||dados.infratores.length||dados.envolvidos.length||dados.grupamento_atendimento;\n      return temEstruturado?(texto?texto+"\\n":"")+MARCADOR_PESSOAS+JSON.stringify(dados):(texto||null);\n    };\n    function sincronizarGrupamentoComTipo(origem=null){\n      const tipo=document.getElementById("tipoRegistro");\n      let bruto=origem?chaveTipoRegistro(origem.tipo_registro):"";\n      if(origem){\n        const grupo=chaveTipoRegistro(origem.grupamento_atendimento||extrairGrupamentoObservacao(origem.observacao_final));\n        grupamentoTatico.checked=Boolean(origem.tatico_setorial)||bruto==="TS"||bruto==="TATICO SETORIAL"||grupo==="TATICO SETORIAL";\n        grupamentoAme.checked=bruto==="AME"||grupo==="AME";\n        if(grupamentoTatico.checked)grupamentoAme.checked=false;\n        if(["ROP","TCO","NI"].includes(bruto)){grupamentoTatico.checked=false;grupamentoAme.checked=false;tipo.value=bruto;tipoDocumentoExibicao.value=bruto;return;}\n      }\n      tipoDocumentoExibicao.value="BO";\n      if(idEdicao&&registroOriginalEdicao&&["ROP","TCO","NI"].includes(chaveTipoRegistro(registroOriginalEdicao.tipo_registro))){tipo.value=chaveTipoRegistro(registroOriginalEdicao.tipo_registro);tipoDocumentoExibicao.value=tipo.value;}else tipo.value="BO";\n    }\n    grupamentoTatico.addEventListener("change",()=>{if(grupamentoTatico.checked)grupamentoAme.checked=false;sincronizarGrupamentoComTipo();});\n    grupamentoAme.addEventListener("change",()=>{if(grupamentoAme.checked)grupamentoTatico.checked=false;sincronizarGrupamentoComTipo();});\n    document.querySelectorAll("[data-local-rapido]").forEach(btn=>btn.addEventListener("click",()=>{document.getElementById("localEntrega").value=btn.dataset.localRapido||"";}));\n    sincronizarGrupamentoComTipo();'
    );
    html=html.replace(
      '      const pessoasSalvas = separarPessoas(x.observacao_final);\n      x.observacao_final = pessoasSalvas.texto;',
      '      const pessoasSalvas = separarPessoas(x.observacao_final);\n      x.grupamento_atendimento = extrairGrupamentoObservacao(x.observacao_final);\n      x.observacao_final = pessoasSalvas.texto;'
    );
    html=html.replace(
      '      Object.keys(mapa).forEach(k => definirCampo(mapa[k],x[k]));\n      carregarItensEstruturados(x);',
      '      Object.keys(mapa).forEach(k => definirCampo(mapa[k],x[k]));\n      sincronizarGrupamentoComTipo(x);\n      carregarItensEstruturados(x);'
    );

    html=html.replace(
      'tipo_registro: tratarNI(document.getElementById("tipoRegistro").value),',
      'tipo_registro: document.getElementById("tipoRegistro").value || "BO",'
    );
    html=html.replace(
      'tatico_setorial: document.getElementById("tipoRegistro").value === "TS",',
      'tatico_setorial: document.getElementById("grupamentoTatico").checked,'
    );

    // Se a edição veio da Auditoria, volta para ela após a confirmação de sucesso.
    html=html.replace(
      'alert("Alterações salvas com sucesso!");\n          location.href = "consulta.html?q=" + encodeURIComponent(registro.numero_bo);\n          return;',
      'alert("Alterações salvas com sucesso!");\n          const retornoSolicitado = new URLSearchParams(location.search).get("retorno");\n          if (retornoSolicitado && /^auditoria\\.html(?:\\?|$)/.test(retornoSolicitado)) location.href = retornoSolicitado;\n          else location.href = "consulta.html?q=" + encodeURIComponent(registro.numero_bo);\n          return;'
    );

    document.open();
    document.write(html);
    document.close();
  } catch(erro) {
    console.error(erro);
    document.body.innerHTML='<div class="loading">Não foi possível carregar o cadastro. Atualize a página.</div>';
  }
})();
</script>
</body>
</html>
