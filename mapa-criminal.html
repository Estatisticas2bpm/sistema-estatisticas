<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa Criminal - 2º BPM</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}:root{--navy:#0b2239;--blue:#1f5a8a;--bg:#eef2f6;--line:#d7e0e8;--muted:#667085}body{margin:0;font:14px Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:#172033}header{background:linear-gradient(120deg,#071a2b,#0b2239 58%,#173b57);color:#fff;padding:18px 24px}.head{width:min(1500px,97%);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}.head h1{margin:0;font-size:25px}.head p{margin:5px 0 0;color:#dbeafe}.head a{color:#fff;text-decoration:none;border:1px solid #ffffff66;border-radius:9px;padding:10px 14px;font-weight:800}main{width:min(1500px,97%);margin:16px auto 30px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:0 5px 20px #18354d0d}.presets,.quick{display:flex;gap:7px;flex-wrap:wrap}.presets{margin-bottom:12px}.presets button,.quick button{border:1px solid #c6d2dc;background:#f8fafc;color:#29465f;border-radius:999px;padding:8px 11px;font-weight:800;cursor:pointer}.presets button.active,.quick button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.filters{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;align-items:end}.filters label{font-size:10px;font-weight:900;text-transform:uppercase;color:#52677a}.filters input,.filters select{display:block;width:100%;margin-top:5px;padding:9px;border:1px solid #cdd8e5;border-radius:8px;background:#fff}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.quick{margin-top:12px}.mapbox{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px;box-shadow:0 5px 20px #18354d0d}#mapa{height:calc(100vh - 285px);min-height:520px;border-radius:11px}.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:9px 4px 0;color:var(--muted);font-size:12px}.legend{background:#fffffff2;border:1px solid #d8e2eb;border-radius:10px;padding:8px 10px;box-shadow:0 4px 12px #102a4322;line-height:1.7;font-size:11px}.legend b{display:block;margin-bottom:3px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;border:1px solid #fff;box-shadow:0 0 0 1px #94a3b8}@media(max-width:1000px){.filters{grid-template-columns:repeat(3,1fr)}#mapa{height:650px}}@media(max-width:600px){.filters{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}#mapa{height:560px}}</style></head><body><header><div class="head"><div><h1>Mapa Criminal</h1><p>Distribuição geográfica das ocorrências do 2º BPM</p></div><a href="index.html">← Página inicial</a></div></header><main><section class="panel"><div class="presets"><button data-period="hoje">Hoje</button><button data-period="7dias">Últimos 7 dias</button><button data-period="mes" class="active">Mês atual</button><button data-period="semana">Semana atual</button></div><div class="filters"><label>Data inicial<input id="ini" type="date"></label><label>Data final<input id="fim" type="date"></label><label>Ocorrência<input id="tipo" placeholder="Todas"></label><label>Bairro<input id="bairro" placeholder="Todos"></label><label>Turno<select id="turno"><option value="">Todos</option><option>MADRUGADA</option><option>MANHÃ</option><option>TARDE</option><option>NOITE</option></select></label><label>Visualização<select id="visual"><option value="pontos">Pontos</option><option value="calor">Mapa de calor</option></select></label><button class="btn" id="atualizar">Atualizar mapa</button></div><div class="quick"><button data-cat="" class="active">Todos</button><button data-cat="ROUBO">Roubo</button><button data-cat="FURTO">Furto</button><button data-cat="VIOLÊNCIA DOMÉSTICA">Violência doméstica</button><button data-cat="DROGAS">Drogas</button><button data-cat="TRÂNSITO">Trânsito</button></div></section><section class="mapbox"><div id="mapa"></div><div class="status"><span id="status">Carregando mapa...</span><span>Use a roda do mouse para aproximar e afastar neste mapa completo.</span></div></section></main><script>const db=supabase.createClient('https://jppmhhukujigxupgskdk.supabase.co','sb_publishable_ZVnU35i2x9zwppQqYg7UYw_mzaT43aG');const $=id=>document.getElementById(id);let base=[],categoriaRapida='',pontos=L.layerGroup(),calor=L.heatLayer([],{radius:34,blur:26,minOpacity:.18,maxZoom:18,gradient:{.18:'#2563eb',.4:'#22c55e',.62:'#facc15',.82:'#f97316',1:'#dc2626'}});const mapa=L.map('mapa',{scrollWheelZoom:true}).setView([2.8235,-60.6758],12);pontos.addTo(mapa);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(mapa);let leg=L.control({position:'bottomright'});leg.onAdd=()=>{let d=L.DomUtil.create('div','legend');d.innerHTML='<b>Natureza</b><i style="background:#dc2626"></i>Roubo<br><i style="background:#f59e0b"></i>Furto<br><i style="background:#8b5cf6"></i>Violência doméstica<br><i style="background:#2563eb"></i>Trânsito<br><i style="background:#16a34a"></i>Drogas<br><i style="background:#64748b"></i>Outras';return d};leg.addTo(mapa);function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function chave(v){return String(v??'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cat(v){let k=chave(v);if(k.includes('ROUBO'))return['ROUBO','#dc2626'];if(k.includes('FURTO'))return['FURTO','#f59e0b'];if(k.includes('MARIA DA PENHA')||k.includes('VIOLENCIA DOMESTICA'))return['VIOLÊNCIA DOMÉSTICA','#8b5cf6'];if(k.includes('TRANSITO')||k.includes('ACIDENTE'))return['TRÂNSITO','#2563eb'];if(k.includes('DROGA')||k.includes('ENTORPECENTE')||k.includes('TRAFICO'))return['DROGAS','#16a34a'];return['OUTRAS','#64748b']}function coordValida(x){if(x.latitude===null||x.latitude===undefined||x.longitude===null||x.longitude===undefined||String(x.latitude).trim()===''||String(x.longitude).trim()==='')return false;let la=Number(x.latitude),lo=Number(x.longitude);return Number.isFinite(la)&&Number.isFinite(lo)&&la>2&&la<4&&lo>-62&&lo<-59}function filtrar(){let t=chave($('tipo').value),b=chave($('bairro').value),tu=chave($('turno').value);return base.filter(x=>coordValida(x)&&(!categoriaRapida||cat(x.ocorrencia||x.crime)[0]===categoriaRapida)&&(!t||chave(x.ocorrencia||x.crime).includes(t))&&(!b||chave(x.bairro).includes(b))&&(!tu||chave(x.turno)===tu))}function render(){let d=filtrar();pontos.clearLayers();if(mapa.hasLayer(calor))mapa.removeLayer(calor);let lim=[];d.forEach(x=>{let c=cat(x.ocorrencia||x.crime),la=Number(x.latitude),lo=Number(x.longitude),pt=L.circleMarker([la,lo],{radius:8,color:'#fff',weight:2,fillColor:c[1],fillOpacity:.94}).bindPopup('<b>'+esc(x.ocorrencia||x.crime||'Ocorrência')+'</b><br><span style="color:'+c[1]+';font-weight:700">'+c[0]+'</span><br>'+esc(x.endereco||'Endereço não informado')+'<br>'+esc(x.bairro||'')+'<br>'+esc(x.data_ocorrencia||'')+' '+esc(x.hora_inicial||''));pt.addTo(pontos);lim.push([la,lo])});if($('visual').value==='calor'){calor.setLatLngs(d.map(x=>[Number(x.latitude),Number(x.longitude),.72]));calor.addTo(mapa)}if(lim.length===1)mapa.setView(lim[0],17);else if(lim.length>1)mapa.fitBounds(lim,{padding:[18,18],maxZoom:17});else mapa.setView([2.8235,-60.6758],12);$('status').textContent=d.length+' ocorrência(s) georreferenciada(s) no filtro.'}async function carregar(){categoriaRapida='';document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x.dataset.cat===''));$('status').textContent='Atualizando mapa...';let datas={data_inicio:$('ini').value,data_fim:$('fim').value};let rr=await Promise.all([db.rpc('obter_ocorrencias_mapa',{...datas,tipo_filtro:null}),db.rpc('obter_dados_dashboard',datas)]);if(rr[0].error){$('status').textContent='Erro ao carregar georreferenciamento: '+rr[0].error.message;return}let mapaDados=rr[0].data||[],estat=rr[1].error?[]:(rr[1].data||[]),porId=new Map(estat.filter(x=>x.id!=null).map(x=>[String(x.id),x])),porBo=new Map(estat.filter(x=>x.numero_bo).map(x=>[chave(x.numero_bo)+'|'+String(x.data_ocorrencia||''),x]));base=mapaDados.map(x=>{let meta=porId.get(String(x.id))||porBo.get(chave(x.numero_bo)+'|'+String(x.data_ocorrencia||''))||{};return Object.assign({},meta,x,{turno:x.turno||meta.turno||'',crime:x.crime||meta.crime||'',bairro:x.bairro||meta.bairro||'',endereco:x.endereco||meta.endereco||''})});render()}function periodo(p){let h=new Date(),i=new Date(h);if(p==='7dias')i.setDate(h.getDate()-6);else if(p==='mes')i=new Date(h.getFullYear(),h.getMonth(),1);else if(p==='semana'){let d=h.getDay(),dif=d===0?-6:1-d;i.setDate(h.getDate()+dif)}$('ini').value=iso(i);$('fim').value=iso(h);document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x.dataset.period===p));carregar()}document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>periodo(b.dataset.period));document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{categoriaRapida=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));render()});$('atualizar').onclick=carregar;$('visual').onchange=render;$('turno').onchange=render;$('bairro').oninput=render;$('tipo').oninput=()=>{categoriaRapida='';document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x.dataset.cat===''));render()};let h=new Date();$('ini').value=iso(new Date(h.getFullYear(),h.getMonth(),1));$('fim').value=iso(h);carregar();</script></body></html>
