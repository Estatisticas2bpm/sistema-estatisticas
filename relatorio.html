<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerador de Relatório</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef2f6;color:#1f2937}header{background:#132b46;color:white;padding:20px}.top,main{max-width:1100px;width:94%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:white}.controls,.report{background:white;margin-top:20px;padding:20px;border-radius:12px}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{font-weight:bold;font-size:13px}input{display:block;padding:9px;border:1px solid #ccc;border-radius:6px;margin-top:5px}button{background:#2556d8;color:white;border:0;border-radius:7px;padding:11px 15px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{border:1px solid #ddd;padding:13px;border-radius:8px}.card strong{display:block;font-size:25px;margin-top:5px}table{width:100%;border-collapse:collapse;margin:12px 0}th,td{padding:8px;border:1px solid #ddd;text-align:left}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px} .photoReport{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.photoItem{break-inside:avoid;border:1px solid #ddd;border-radius:8px;overflow:hidden}.photoItem img{width:100%;height:155px;object-fit:cover;display:block}.photoItem div{padding:7px;font-size:11px} @media print{header,.controls{display:none}body{background:white}.report{box-shadow:none;margin:0;padding:0}.page-break{break-before:page}}@media(max-width:700px){.cards,.two{grid-template-columns:1fr}}</style></head><body><header><div class="top"><h1>Gerar Relatório</h1><a href="index.html">← Início</a></div></header><main><section class="controls"><label>Data inicial<input id="ini" type="date"></label><label>Data final<input id="fim" type="date"></label><button id="gerar">Gerar relatório</button><button onclick="window.print()">Imprimir / Salvar em PDF</button></section><article id="rel" class="report"><h1>Relatório Operacional</h1><p id="periodo"></p><div class="cards"><div class="card">Total<strong id="total">0</strong></div><div class="card">Atendidas<strong id="at">0</strong></div><div class="card">Reprimidas<strong id="rep">0</strong></div><div class="card">Taxa de atendimento<strong id="taxa">0%</strong></div></div><div class="two"><section><h2>Principais ocorrências/crimes</h2><table><tbody id="tCrime"></tbody></table></section><section><h2>Principais bairros</h2><table><tbody id="tBairro"></tbody></table></section><section><h2>Comandantes</h2><table><tbody id="tCmd"></tbody></table></section><section><h2>Demandas reprimidas por motivo</h2><table><tbody id="tMotivo"></tbody></table></section></div><section><h2>Produtividade operacional</h2><table id="prod"></table></section><section><h2>Ações preventivas e sociais</h2><table><thead><tr><th>Tipo</th><th>Quantidade</th></tr></thead><tbody id="tAcoes"></tbody></table><div id="fotosRelatorio" class="photoReport"></div></section></article></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://jppmhhukujigxupgskdk.supabase.co","sb_publishable_ZVnU35i2x9zwppQqYg7UYw_mzaT43aG");function rank(a,c){var m={};a.forEach(function(x){var k=x[c]||"NÃO INFORMADO";m[k]=(m[k]||0)+1});return Object.entries(m).sort(function(x,y){return y[1]-x[1]}).slice(0,15)}function soma(a,c){return a.reduce(function(s,x){return s+(Number(x[c])||0)},0)}function tabela(id,it){document.getElementById(id).innerHTML=it.map(function(x){return "<tr><td>"+x[0]+"</td><td>"+x[1]+"</td></tr>"}).join("")}async function montar(){periodo.textContent="Período: "+ini.value.split("-").reverse().join("/")+" a "+fim.value.split("-").reverse().join("/");var rr=await Promise.all([db.rpc("obter_dados_dashboard",{data_inicio:ini.value,data_fim:fim.value}),db.rpc("obter_acoes_preventivas",{data_inicio:ini.value,data_fim:fim.value})]),d=rr[0].data||[],a=rr[1].data||[],atd=d.filter(function(x){return x.status_atendimento!=="DEMANDA REPRIMIDA"}),r=d.filter(function(x){return x.status_atendimento==="DEMANDA REPRIMIDA"});total.textContent=d.length;at.textContent=atd.length;rep.textContent=r.length;taxa.textContent=(d.length?Math.round(atd.length*100/d.length):0)+"%";tabela("tCrime",rank(d,"crime"));tabela("tBairro",rank(d,"bairro"));tabela("tCmd",rank(d,"comandante"));tabela("tMotivo",rank(r,"motivo_repressao"));prod.innerHTML="<tr><th>Prisões</th><td>"+soma(d,"numero_prisoes")+"</td><th>Conduzidos</th><td>"+soma(d,"numero_conduzidos")+"</td></tr><tr><th>Orientações</th><td>"+soma(d,"orientacoes")+"</td><th>Veículos recuperados</th><td>"+soma(d,"veiculos_recuperados")+"</td></tr><tr><th>Armas</th><td>"+soma(d,"quantidade_armas")+"</td><th>Munições</th><td>"+soma(d,"quantidade_municoes")+"</td></tr>";var am={};a.forEach(function(x){am[x.tipo_acao]=(am[x.tipo_acao]||0)+(Number(x.quantidade)||0)});tabela("tAcoes",Object.entries(am));var fotos=[];a.forEach(function(x){var fs=[];if(Array.isArray(x.fotos))fs=x.fotos;else if(x.fotos){try{fs=JSON.parse(x.fotos)}catch(e){fs=String(x.fotos).split(",")}}fs.forEach(function(url){if(url)fotos.push({url:String(url).trim(),tipo:x.tipo_acao,data:x.data_acao})})});fotosRelatorio.innerHTML=fotos.map(function(f){return "<div class=\"photoItem\"><img src=\""+f.url+"\" alt=\"Fotografia de ação preventiva\"><div><b>"+f.tipo+"</b><br>"+f.data.split("-").reverse().join("/")+"</div></div>"}).join("")}gerar.onclick=montar;var h=new Date();ini.value=new Date(h.getFullYear(),h.getMonth(),1).toISOString().slice(0,10);fim.value=h.toISOString().slice(0,10);montar();</script></body></html>
