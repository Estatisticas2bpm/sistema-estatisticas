<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar TCO</title>
<style>
*{box-sizing:border-box}:root{--azul-escuro:#132b46;--azul:#2556d8;--verde:#14845f;--fundo:#eef2f6;--borda:#d7e0ea;--texto:#1f2937;--suave:#64748b;--vermelho:#b91c1c}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fundo);color:var(--texto)}header{padding:24px 20px;background:var(--azul-escuro);color:#fff}.topo{width:min(1000px,94%);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}header h1{margin:0 0 5px;font-size:25px}header p{margin:0;opacity:.85}.voltar{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.45);padding:10px 16px;border-radius:8px}main{width:min(1000px,94%);margin:28px auto}.painel{background:#fff;border-radius:14px;padding:22px;box-shadow:0 4px 16px rgba(0,0,0,.07);margin-bottom:18px}.painel h2{margin:0 0 16px;color:var(--azul-escuro);font-size:19px}.grade{display:grid;grid-template-columns:2fr 1fr auto;gap:12px;align-items:end}.grade2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.campo label{display:block;margin-bottom:7px;font-weight:bold;color:#334155;font-size:14px}input,textarea{width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:8px;font:inherit}textarea{min-height:84px;resize:vertical}button{border:0;border-radius:8px;padding:11px 16px;background:var(--azul);color:#fff;font-weight:bold;cursor:pointer;min-height:43px}button.sec{background:#fff;color:var(--azul);border:1px solid var(--azul)}button.danger{background:#fff;color:var(--vermelho);border:1px solid #ef4444}.status{margin-top:14px;color:var(--suave)}.bo-card{border:1px solid #bfdbfe;background:#eff6ff;border-radius:12px;padding:16px;margin-top:16px}.bo-card h3{margin:0 0 10px;color:#1e3a8a}.dados{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dado{background:#fff;border-radius:9px;padding:10px;border:1px solid #dbeafe}.dado small{display:block;color:var(--suave);font-weight:bold;margin-bottom:4px}.lista{margin-top:14px;border-top:1px solid #dbeafe;padding-top:12px}.tco-antigo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #e5e7eb}.form-tco{margin-top:18px;padding-top:18px;border-top:1px solid var(--borda)}.acoes{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.oculto{display:none!important}.sucesso{color:#166534}.erro{color:#991b1b}@media(max-width:700px){.topo{align-items:flex-start;flex-direction:column}.grade,.grade2,.dados{grid-template-columns:1fr}.acoes{flex-direction:column}.acoes button{width:100%}}
</style>
<script src="auth-config.js"></script><script src="auth-guard.js"></script></head>
<body>
<header><div class="topo"><div><h1>Cadastrar TCO</h1><p>Vincule o TCO ao BO correspondente</p></div><a class="voltar" href="index.html">← Voltar ao painel</a></div></header>
<main>
<section class="painel">
<h2>1. Localizar o BO</h2>
<div class="grade">
<div class="campo"><label for="numeroBo">Número do BO</label><input id="numeroBo" placeholder="Ex.: 123456" inputmode="numeric"></div>
<div class="campo"><label for="anoBo">Ano</label><input id="anoBo" type="number" min="2020" max="2100"></div>
<button id="buscarBo" type="button">Buscar BO</button>
</div>
<p id="statusBusca" class="status">Informe o número do BO para localizar a ocorrência.</p>
<div id="resultadoBo"></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const banco=supabase.createClient('https://jppmhhukujigxupgskdk.supabase.co','sb_publishable_ZVnU35i2x9zwppQqYg7UYw_mzaT43aG');
const numeroBo=document.getElementById('numeroBo'),anoBo=document.getElementById('anoBo'),statusBusca=document.getElementById('statusBusca'),resultadoBo=document.getElementById('resultadoBo');
let boSelecionado=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function dataBR(v){if(!v)return '—';const p=String(v).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v}
function hoje(){const d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),dia=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+dia}
function renderBo(bo){boSelecionado=bo;const tcos=Array.isArray(bo.tcos)?bo.tcos:[];resultadoBo.innerHTML=`<div class="bo-card"><h3>BO ${esc(bo.numero_bo)}</h3><div class="dados"><div class="dado"><small>Data</small>${dataBR(bo.data_ocorrencia)}</div><div class="dado"><small>Ocorrência</small>${esc(bo.ocorrencia||'—')}</div><div class="dado"><small>Bairro</small>${esc(bo.bairro||'—')}</div><div class="dado"><small>Subtipo</small>${esc(bo.crime||'—')}</div><div class="dado"><small>Companhia</small>${esc(bo.companhia||'—')}</div><div class="dado"><small>Comandante</small>${esc(bo.comandante||'—')}</div></div><div class="lista"><strong>TCO(s) já vinculado(s):</strong>${tcos.length?tcos.map(t=>`<div class="tco-antigo"><span><b>${esc(t.numero_tco)}</b> — ${dataBR(t.data_tco)}</span><button class="danger excluirTco" data-id="${esc(t.id)}" type="button">Excluir</button></div>`).join(''):'<p class="status">Nenhum TCO vinculado a este BO.</p>'}</div><div class="form-tco"><h3>2. Registrar TCO</h3><div class="grade2"><div class="campo"><label for="numeroTco">Número do TCO</label><input id="numeroTco" placeholder="Ex.: 000123/2026"></div><div class="campo"><label for="dataTco">Data do TCO</label><input id="dataTco" type="date" value="${bo.data_ocorrencia||hoje()}"></div></div><div class="campo" style="margin-top:14px"><label for="obsTco">Observação <span style="font-weight:normal;color:#64748b">(opcional)</span></label><textarea id="obsTco" placeholder="Informação complementar, se necessário"></textarea></div><div class="acoes"><button id="salvarTco" type="button">Salvar TCO vinculado</button></div><p id="statusTco" class="status"></p></div></div>`;
document.getElementById('salvarTco').addEventListener('click',salvarTco);resultadoBo.querySelectorAll('.excluirTco').forEach(b=>b.addEventListener('click',()=>excluirTco(b.dataset.id)));
}
async function buscar(){statusBusca.className='status';statusBusca.textContent='Buscando BO...';resultadoBo.innerHTML='';boSelecionado=null;const n=numeroBo.value.trim(),a=Number(anoBo.value)||null;if(!n){statusBusca.textContent='Informe o número do BO.';return}const r=await banco.rpc('buscar_bo_para_tco',{p_numero_bo:n,p_ano:a,p_ocorrencia_id:null});if(r.error){console.error(r.error);statusBusca.className='status erro';statusBusca.textContent='Não foi possível consultar o BO.';return}const dados=r.data||[];if(!dados.length){statusBusca.className='status erro';statusBusca.textContent='BO não encontrado. Cadastre primeiro a ocorrência correspondente.';return}if(dados.length>1){statusBusca.textContent='Foram encontrados '+dados.length+' registros. Informe o ano para selecionar o BO correto.';resultadoBo.innerHTML=dados.map(bo=>`<div class="bo-card"><b>BO ${esc(bo.numero_bo)} — ${dataBR(bo.data_ocorrencia)}</b><div class="acoes"><button class="selecionarBo" data-id="${esc(bo.id)}" type="button">Selecionar</button></div></div>`).join('');resultadoBo.querySelectorAll('.selecionarBo').forEach(b=>b.addEventListener('click',()=>{const bo=dados.find(x=>x.id===b.dataset.id);renderBo(bo)}));return}statusBusca.className='status sucesso';statusBusca.textContent='BO localizado. Confira os dados abaixo.';renderBo(dados[0])}
async function carregarPorId(id){statusBusca.textContent='Carregando BO...';const r=await banco.rpc('buscar_bo_para_tco',{p_numero_bo:null,p_ano:null,p_ocorrencia_id:id});if(r.error||!(r.data||[]).length){statusBusca.className='status erro';statusBusca.textContent='Não foi possível localizar o BO informado.';return}const bo=r.data[0];numeroBo.value=bo.numero_bo||'';anoBo.value=String(bo.data_ocorrencia||'').slice(0,4);statusBusca.className='status sucesso';statusBusca.textContent='BO localizado automaticamente.';renderBo(bo)}
async function salvarTco(){if(!boSelecionado)return;const numero=document.getElementById('numeroTco').value.trim(),data=document.getElementById('dataTco').value,obs=document.getElementById('obsTco').value.trim(),st=document.getElementById('statusTco'),btn=document.getElementById('salvarTco');if(!numero){st.className='status erro';st.textContent='Informe o número do TCO.';return}btn.disabled=true;btn.textContent='Salvando...';const r=await banco.rpc('cadastrar_tco_publico',{p_ocorrencia_id:boSelecionado.id,p_numero_tco:numero,p_data_tco:data||null,p_observacao:obs||null});btn.disabled=false;btn.textContent='Salvar TCO vinculado';if(r.error){console.error(r.error);st.className='status erro';st.textContent=r.error.message||'Não foi possível salvar o TCO.';return}st.className='status sucesso';st.textContent='TCO '+numero+' vinculado ao BO '+boSelecionado.numero_bo+' com sucesso.';await carregarPorId(boSelecionado.id)}
async function excluirTco(id){if(!confirm('Deseja excluir este TCO vinculado?'))return;const r=await banco.rpc('excluir_tco_publico',{p_id:id});if(r.error||r.data!==true){alert('Não foi possível excluir o TCO.');return}await carregarPorId(boSelecionado.id)}
document.getElementById('buscarBo').addEventListener('click',buscar);numeroBo.addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});const params=new URLSearchParams(location.search),id=params.get('bo_id'),n=params.get('bo'),ano=params.get('ano');anoBo.value=ano||new Date().getFullYear();if(id)carregarPorId(id);else if(n){numeroBo.value=n;buscar()}
</script>
</body>
</html>
