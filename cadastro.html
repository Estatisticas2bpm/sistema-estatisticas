<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SIE-CPC — Cadastro de Ocorrência</title>
  <style>body{margin:0;background:#eef2f6;font:15px Arial,sans-serif;color:#334155;display:grid;place-items:center;min-height:100vh}.loading{background:#fff;padding:24px 30px;border-radius:12px;box-shadow:0 4px 16px #0001;font-weight:700}</style>
<script src="auth-config.js"></script><script src="auth-guard.js"></script></head>
<body><div class="loading">Carregando cadastro...</div>
<script>
(async function(){
  try {
    const sessaoCadastro=window.SistemaAuth?.ready?await window.SistemaAuth.ready:window.SistemaAuth;
    const ehCipturCadastro=String(sessaoCadastro?.contexto?.sigla||sessaoCadastro?.perfil?.unidades?.sigla||'').toUpperCase()==='CIPTUR';
    const resposta=await fetch('cadastro-base.html?v=20261001-torfix1',{cache:'no-store'});
    if(!resposta.ok) throw new Error('Falha ao carregar a base do cadastro.');
    let html=await resposta.text();

    // Novos cadastros: o documento é sempre BO. ROP/TCO ficam somente para compatibilidade histórica.
    html=html.replaceAll('<option>ROP</option>','');
    html=html.replaceAll('<option>TCO</option>','');

    // NI deixa de ser uma opção de preenchimento em toda a tela de cadastro.
    html=html.replaceAll('<option>NI — Não Informado</option>','');
    html=html.replaceAll('<option value="NI">NI — Não Informado</option>','');

    // A rotina atual trabalha com número de BO.
    html=html.replaceAll('Nº BO/ROP *','Nº BO *');
    html=html.replaceAll('Informe o número do BO/ROP.','Informe o número do BO.');

    // Tipo de documento visível = BO. O grupamento operacional varia conforme a unidade.
    // Na CIPTUR, a única opção especializada é TOR — Tático Ostensivo Rodoviário.
    // Nas demais unidades, preservamos Tático Setorial e AME.
    const opcoesGrupamento=ehCipturCadastro
      ? '<label class="resultado-opcao" style="min-width:280px"><input id="grupamentoTor" type="checkbox"> TOR — TÁTICO OSTENSIVO RODOVIÁRIO</label>'
      : '<label class="resultado-opcao" style="min-width:190px"><input id="grupamentoTatico" type="checkbox"> TÁTICO SETORIAL</label><label class="resultado-opcao" style="min-width:190px"><input id="grupamentoAme" type="checkbox"> AME</label>';
    const notaGrupamento=ehCipturCadastro
      ? 'Marque TOR somente quando o BO tiver sido atendido pelo Tático Ostensivo Rodoviário.'
      : 'Marque somente quando o BO tiver sido atendido por um desses grupamentos. As opções são exclusivas.';
    html=html.replace(
      /<div class="campo">\s*<label for="tipoRegistro">Tipo \*<\/label>\s*<select id="tipoRegistro" name="tipoRegistro" required>[\s\S]*?<\/select>\s*<\/div>/,
      '<div class="campo"><label>Tipo de documento</label><input id="tipoDocumentoExibicao" type="text" value="BO" readonly aria-label="Tipo de documento"><select id="tipoRegistro" name="tipoRegistro" required hidden><option value="BO" selected>BO</option><option value="ROP">ROP</option><option value="TCO">TCO</option><option value="NI">NI</option></select><span class="nota">Nos novos registros, toda ocorrência operacional é registrada por Boletim de Ocorrência (BO).</span></div><div class="campo duplo"><label>Guarnição especializada</label><div class="selecao-grupamento" style="display:flex;gap:10px;flex-wrap:wrap">'+opcoesGrupamento+'</div><span class="nota">'+notaGrupamento+'</span></div>'
    );

    // Os atalhos rápidos de local de entrega agora são carregados do Supabase por unidade.
    // A base do cadastro renderiza e gerencia a configuração de até seis atalhos.

    // Comandante é obrigatório em NOVOS cadastros.
    html=html.replace(
      '<label for="comandante">Comandante da viatura</label>',
      ehCipturCadastro
        ? '<label for="comandante">CMT — Comandante *</label>'
        : '<label for="comandante">Comandante da viatura *</label>'
    );
    if(ehCipturCadastro){
      html=html.replace(
        '<span class="nota">Use o padrão: graduação abreviada + nome de guerra.</span>\n          </div>\n        </div>\n      </section>',
        '<span class="nota">Use o padrão: graduação abreviada + nome de guerra.</span>\n          </div>\n          <div class="campo"><label for="guarnicaoMot">MOT — Motorista</label><div class="campo-com-acao guarnicao"><input id="guarnicaoMot" name="guarnicaoMot" type="text" list="listaComandantes" autocomplete="off" placeholder="Pesquise e selecione"><button class="botao-adicionar botao-guarnicao" id="editarGuarnicaoMot" type="button" title="Editar policial selecionado" aria-label="Editar policial selecionado">✎</button><button class="botao-adicionar botao-guarnicao" id="abrirNovoGuarnicaoMot" type="button" title="Incluir policial na lista" aria-label="Incluir policial na lista">+</button></div><span class="nota">Opcional. Usa a mesma lista de policiais do CMT.</span></div>\n          <div class="campo"><label for="guarnicaoPtr1">PTR 1 — Patrulheiro 1</label><div class="campo-com-acao guarnicao"><input id="guarnicaoPtr1" name="guarnicaoPtr1" type="text" list="listaComandantes" autocomplete="off" placeholder="Pesquise e selecione"><button class="botao-adicionar botao-guarnicao" id="editarGuarnicaoPtr1" type="button" title="Editar policial selecionado" aria-label="Editar policial selecionado">✎</button><button class="botao-adicionar botao-guarnicao" id="abrirNovoGuarnicaoPtr1" type="button" title="Incluir policial na lista" aria-label="Incluir policial na lista">+</button></div><span class="nota">Opcional. Primeiro patrulheiro.</span></div>\n          <div class="campo"><label for="guarnicaoPtr2">PTR 2 — Patrulheiro 2</label><div class="campo-com-acao guarnicao"><input id="guarnicaoPtr2" name="guarnicaoPtr2" type="text" list="listaComandantes" autocomplete="off" placeholder="Pesquise e selecione"><button class="botao-adicionar botao-guarnicao" id="editarGuarnicaoPtr2" type="button" title="Editar policial selecionado" aria-label="Editar policial selecionado">✎</button><button class="botao-adicionar botao-guarnicao" id="abrirNovoGuarnicaoPtr2" type="button" title="Incluir policial na lista" aria-label="Incluir policial na lista">+</button></div><span class="nota">Opcional. No PDF antigo também pode aparecer como SEG.</span></div>\n        </div>\n      </section>'
      );
    }
    html=html.replace(
      '["horaInicial","Informe a hora inicial."],\n        ["ocorrencia","Selecione o Tipo de Ocorrência."]',
      '["horaInicial","Informe a hora inicial."],\n        ["comandante","Informe o comandante da viatura."],\n        ["ocorrencia","Selecione o Tipo de Ocorrência."]'
    );

    // Separação semântica: tipo_registro fica BO e o grupamento é salvo dentro do
    // mesmo JSON estruturado já usado em observacao_final. Tático também mantém o
    // booleano legado tatico_setorial para compatibilidade com consultas antigas.
    html=html.replace(
      "    const idEdicao = new URLSearchParams(location.search).get(\"id\");\n    let registroOriginalEdicao = null;",
      "    const idEdicao = new URLSearchParams(location.search).get(\"id\");\n    let registroOriginalEdicao = null;\n    const grupamentoTatico = document.getElementById(\"grupamentoTatico\");\n    const grupamentoAme = document.getElementById(\"grupamentoAme\");\n    const grupamentoTor = document.getElementById(\"grupamentoTor\");\n    const tipoDocumentoExibicao = document.getElementById(\"tipoDocumentoExibicao\");\n    function chaveTipoRegistro(v){return String(v||\"\").trim().normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g,\"\").toUpperCase();}\n    function grupamentoSelecionado(){if(grupamentoTor?.checked)return \"TOR\";if(grupamentoTatico?.checked)return \"TÁTICO SETORIAL\";if(grupamentoAme?.checked)return \"AME\";return null;}\n    function extrairGrupamentoObservacao(valor){\n      const texto=String(valor||\"\");const pos=texto.indexOf(MARCADOR_PESSOAS);if(pos<0)return null;\n      try{return JSON.parse(texto.slice(pos+MARCADOR_PESSOAS.length)).grupamento_atendimento||null}catch(_){return null}\n    }\n    function extrairGuarnicaoObservacao(valor){\n      const texto=String(valor||\"\");const pos=texto.indexOf(MARCADOR_PESSOAS);if(pos<0)return {};\n      try{return JSON.parse(texto.slice(pos+MARCADOR_PESSOAS.length)).guarnicao_componentes||{}}catch(_){return {}}\n    }\n    function componentesGuarnicaoAtual(){return{mot:document.getElementById(\"guarnicaoMot\")?.value.trim()||null,ptr1:document.getElementById(\"guarnicaoPtr1\")?.value.trim()||null,ptr2:document.getElementById(\"guarnicaoPtr2\")?.value.trim()||null}}\n    montarObservacaoFinal=function(){\n      const texto=document.getElementById(\"observacaoFinal\").value.trim();\n      const dados={vitimas:pessoasAdicionais(\"vitima\"),infratores:pessoasAdicionais(\"infrator\"),envolvidos:pessoasAdicionais(\"envolvido\"),grupamento_atendimento:grupamentoSelecionado(),guarnicao_componentes:componentesGuarnicaoAtual()};\n      const temEstruturado=dados.vitimas.length||dados.infratores.length||dados.envolvidos.length||dados.grupamento_atendimento||dados.guarnicao_componentes.mot||dados.guarnicao_componentes.ptr1||dados.guarnicao_componentes.ptr2;\n      return temEstruturado?(texto?texto+\"\\n\":\"\")+MARCADOR_PESSOAS+JSON.stringify(dados):(texto||null);\n    };\n    function sincronizarGrupamentoComTipo(origem=null){\n      const tipo=document.getElementById(\"tipoRegistro\");\n      let bruto=origem?chaveTipoRegistro(origem.tipo_registro):\"\";\n      const grupo=origem?chaveTipoRegistro(origem.grupamento_atendimento||extrairGrupamentoObservacao(origem.observacao_final)):\"\";\n      if(origem){\n        if(grupamentoTor)grupamentoTor.checked=grupo===\"TOR\"||bruto===\"TOR\";\n        if(grupamentoTatico)grupamentoTatico.checked=Boolean(origem?.tatico_setorial)||bruto===\"TS\"||bruto===\"TATICO SETORIAL\"||grupo===\"TATICO SETORIAL\";\n        if(grupamentoAme)grupamentoAme.checked=bruto===\"AME\"||grupo===\"AME\";\n      }\n      if(grupamentoTatico?.checked&&grupamentoAme)grupamentoAme.checked=false;\n      if(grupamentoAme?.checked&&grupamentoTatico)grupamentoTatico.checked=false;\n      if(origem&&[\"ROP\",\"TCO\",\"NI\"].includes(bruto)){if(grupamentoTor)grupamentoTor.checked=false;if(grupamentoTatico)grupamentoTatico.checked=false;if(grupamentoAme)grupamentoAme.checked=false;tipo.value=bruto;tipoDocumentoExibicao.value=bruto;return;}\n      tipoDocumentoExibicao.value=\"BO\";\n      if(idEdicao&&registroOriginalEdicao&&[\"ROP\",\"TCO\",\"NI\"].includes(chaveTipoRegistro(registroOriginalEdicao.tipo_registro))){tipo.value=chaveTipoRegistro(registroOriginalEdicao.tipo_registro);tipoDocumentoExibicao.value=tipo.value;}else tipo.value=\"BO\";\n    }\n    grupamentoTatico?.addEventListener(\"change\",()=>{if(grupamentoTatico.checked&&grupamentoAme)grupamentoAme.checked=false;sincronizarGrupamentoComTipo();});\n    grupamentoAme?.addEventListener(\"change\",()=>{if(grupamentoAme.checked&&grupamentoTatico)grupamentoTatico.checked=false;sincronizarGrupamentoComTipo();});\n    grupamentoTor?.addEventListener(\"change\",()=>sincronizarGrupamentoComTipo());\n    document.querySelectorAll(\"[data-local-rapido]\").forEach(btn=>btn.addEventListener(\"click\",()=>{document.getElementById(\"localEntrega\").value=btn.dataset.localRapido||\"\";}));\n    sincronizarGrupamentoComTipo();"
    );
    html=html.replace(
      '      const pessoasSalvas = separarPessoas(x.observacao_final);\n      x.observacao_final = pessoasSalvas.texto;',
      '      const pessoasSalvas = separarPessoas(x.observacao_final);\n      x.grupamento_atendimento = extrairGrupamentoObservacao(x.observacao_final);\n      x.guarnicao_componentes = extrairGuarnicaoObservacao(x.observacao_final);\n      x.observacao_final = pessoasSalvas.texto;'
    );
    html=html.replace(
      '      Object.keys(mapa).forEach(k => definirCampo(mapa[k],x[k]));\n      carregarItensEstruturados(x);',
      '      Object.keys(mapa).forEach(k => definirCampo(mapa[k],x[k]));\n      definirCampo("guarnicaoMot",x.guarnicao_componentes?.mot);\n      definirCampo("guarnicaoPtr1",x.guarnicao_componentes?.ptr1);\n      definirCampo("guarnicaoPtr2",x.guarnicao_componentes?.ptr2);\n      sincronizarGrupamentoComTipo(x);\n      carregarItensEstruturados(x);'
    );

    html=html.replace(
      'tipo_registro: tratarNI(document.getElementById("tipoRegistro").value),',
      'tipo_registro: document.getElementById("tipoRegistro").value || "BO",'
    );
    html=html.replace(
      'tatico_setorial: document.getElementById("tipoRegistro").value === "TS",',
      'tatico_setorial: Boolean(document.getElementById("grupamentoTatico")?.checked),'
    );

    // Se a edição veio da Auditoria, volta para ela após a confirmação de sucesso.
    html=html.replace(
      'alert("Alterações salvas com sucesso!");\n          location.href = "consulta.html?q=" + encodeURIComponent(registro.numero_bo);\n          return;',
      'alert("Alterações salvas com sucesso!");\n          const retornoSolicitado = new URLSearchParams(location.search).get("retorno");\n          if (retornoSolicitado && /^auditoria\\.html(?:\\?|$)/.test(retornoSolicitado)) location.href = retornoSolicitado;\n          else location.href = "consulta.html?q=" + encodeURIComponent(registro.numero_bo);\n          return;'
    );

    // Melhorias modulares: veículos e resumo histórico por fatos essenciais.
    html=html.replace('</body>','<script src="cadastro-enhancements.js?v=20260828-1"><\/script><script src="cadastro-summary-v2.js?v=20260828-1"><\/script><script src="cadastro-summary-v3.js?v=20260828-1"><\/script><script src="cadastro-summary-v5.js?v=20260831-1"><\/script></body>');

    document.open();
    document.write(html);
    document.close();
  } catch(erro) {
    console.error(erro);
    document.body.innerHTML='<div class="loading">Não foi possível carregar o cadastro. Atualize a página.</div>';
  }
})();
</script>
</body>
</html>
