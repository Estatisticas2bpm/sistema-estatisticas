cias',CORES.teal);let entMes=rank(entRegistros,x=>String(x.data_ocorrencia||'').slice(0,7),999).sort((x,y)=>x[0].localeCompare(y[0]));chart('chartEntMes','line',entMes.map(x=>x[0]),entMes.map(x=>x[1]),'Ocorrências com entorpecentes',CORES.steel);let entBairros=rank(entRegistros,x=>normalizarBairro(x.bairro),10);chart('chartEntBairros','bar',entBairros.map(x=>x[0]),entBairros.map(x=>x[1]),'Ocorrências',CORES.blue);let entRegiao=rank(entRegistros,'sisc',10);chart('chartEntRegiao','bar',entRegiao.map(x=>x[0]),entRegiao.map(x=>x[1]),'Ocorrências',CORES.amber);"
