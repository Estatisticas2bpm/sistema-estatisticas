name: Aplicar lógica visual de entorpecentes v2

on:
  push:
    paths:
      - '.github/workflows/corrigir-logica-entorpecentes-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir arquivos
        shell: python
        run: |
          from pathlib import Path
          import re

          def require(cond, msg):
              if not cond:
                  raise SystemExit(msg)

          # ============================================================
          # cadastro.html
          # ============================================================
          p=Path('cadastro.html')
          s=p.read_text(encoding='utf-8')

          old='<div><h3>Substâncias apreendidas</h3><small>Cadastre somente quando houver apreensão.</small></div>'
          new='<div><h3>Substâncias apreendidas</h3><small>Registre somente o constatado visualmente: tipo, forma de apresentação e quantidade de unidades. Não informe peso (g, kg ou mg).</small></div>'
          require(old in s,'Cabeçalho de entorpecentes não encontrado')
          s=s.replace(old,new,1)

          old='<div class="lista-itens" id="entorpecentesItens"><p class="lista-vazia">Nenhum entorpecente informado.</p></div>'
          new='<div id="avisoEntorpecentesLegados" hidden style="margin-bottom:12px;padding:12px;border:1px solid #f59e0b;border-radius:9px;background:#fffbeb;color:#92400e"><strong>Registro legado:</strong> esta ocorrência possui informação antiga de droga em peso. O dado foi preservado no banco, mas não será convertido nem somado como unidade visual.</div><div class="lista-itens" id="entorpecentesItens"><p class="lista-vazia">Nenhum entorpecente informado.</p></div>'
          require(old in s,'Lista de entorpecentes não encontrada')
          s=s.replace(old,new,1)

          old='const TIPOS_ENTORPECENTES = ["MACONHA","COCAÍNA","PASTA BASE","CRACK","SKANK","ECSTASY","LSD","OUTRO"];\n    const UNIDADES_ENTORPECENTES = ["GRAMA (g)","QUILOGRAMA (kg)","UNIDADE","PORÇÃO","INVÓLUCRO","OUTRO"];'
          new='const TIPOS_ENTORPECENTES = ["MACONHA","COCAÍNA","CRACK","SKUNK","ECSTASY","OUTROS"];\n    const FORMAS_ENTORPECENTES = ["INVÓLUCRO","PORÇÃO","TABLETE","TIJOLO","PAPELOTE","PINO","COMPRIMIDO","SACOLA","OUTROS"];'
          require(old in s,'Catálogo antigo de entorpecentes não encontrado')
          s=s.replace(old,new,1)

          # Importador PDF: nunca extrair peso. Só cria item quando houver quantidade inteira + apresentação visual.
          pattern=r'''        const tipoDroga = TIPOS_ENTORPECENTES\.filter\(t=>t!=="OUTRO"\)\.find\(t=>chave\.includes\(textoComparavel\(t\)\)\);\n        if \(tipoDroga \|\| chave\.includes\("ENTORPECENTE"\) \|\| chave\.includes\("DROGA"\)\) \{\n          const quantidade = .*?\n          const unidadeTexto = .*?\n          const unidade = .*?\n          dados\.entorpecentes\.push\(\{tipo:tipoDroga \|\| "OUTRO",quantidade,unidade,detalhes:descricao\}\); return;\n        \}'''
          replacement='''        let tipoDroga = TIPOS_ENTORPECENTES.filter(t=>t!=="OUTROS").find(t=>chave.includes(textoComparavel(t)));
        if (!tipoDroga && chave.includes("SKANK")) tipoDroga = "SKUNK";
        if (!tipoDroga && (chave.includes("PASTA BASE") || chave.includes("LSD"))) tipoDroga = "OUTROS";
        if (tipoDroga || chave.includes("ENTORPECENTE") || chave.includes("DROGA")) {
          const achado = descricao.match(/\\b(\\d+)\\s*(INV[ÓO]LUCROS?|POR[ÇC][ÕO]ES?|TABLETES?|TIJOLOS?|PAPELOTES?|PINOS?|COMPRIMIDOS?|SACOLAS?)\\b/i);
          if (!achado) return;
          const formaChave = textoComparavel(achado[2]);
          const forma = formaChave.includes("INVOLUCRO") ? "INVÓLUCRO" : formaChave.includes("PORCAO") ? "PORÇÃO" : formaChave.includes("TABLETE") ? "TABLETE" : formaChave.includes("TIJOLO") ? "TIJOLO" : formaChave.includes("PAPELOTE") ? "PAPELOTE" : formaChave.includes("PINO") ? "PINO" : formaChave.includes("COMPRIMIDO") ? "COMPRIMIDO" : formaChave.includes("SACOLA") ? "SACOLA" : "OUTROS";
          dados.entorpecentes.push({tipo:tipoDroga || "OUTROS",quantidade:Number(achado[1]),forma_apresentacao:forma,detalhes:descricao}); return;
        }'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          require(n==1,'Bloco do importador PDF de drogas não encontrado')
          s=s2

          # Editor estruturado.
          pattern=r'''    function adicionarEntorpecenteItem\(dados = \{\}\) \{.*?\n    \}\n    function adicionarBemSubtraido'''
          replacement='''    function adicionarEntorpecenteItem(dados = {}) {
      const recipiente = document.getElementById("entorpecentesItens");
      const bloco = document.createElement("div");
      bloco.className = "item-estruturado entorpecente";
      let tipo = String(dados.tipo || "").toUpperCase();
      if (tipo === "SKANK") tipo = "SKUNK";
      if (["PASTA BASE","LSD","OUTRO"].includes(tipo)) tipo = "OUTROS";
      let forma = String(dados.forma_apresentacao || dados.forma || dados.unidade || "").toUpperCase();
      if (["UNIDADE","OUTRO"].includes(forma)) forma = "OUTROS";
      if (!FORMAS_ENTORPECENTES.includes(forma)) forma = "OUTROS";
      bloco.innerHTML = `<div class="campo"><label>Tipo de entorpecente</label><select data-item="tipo" required>${opcoesHtml(TIPOS_ENTORPECENTES,tipo)}</select></div><div class="campo"><label>Forma de apresentação</label><select data-item="forma_apresentacao" required>${opcoesHtml(FORMAS_ENTORPECENTES,forma)}</select></div><div class="campo"><label>Quantidade</label><input data-item="quantidade" type="number" min="1" step="1" inputmode="numeric" value="${Number.isInteger(Number(dados.quantidade)) && Number(dados.quantidade)>0 ? Number(dados.quantidade) : 1}" required></div><div class="campo"><label>Detalhes/observações</label><input data-item="detalhes" value="${escaparHtml(dados.detalhes || "")}" placeholder="Informação opcional"></div><button class="remover-item" type="button" title="Remover este entorpecente" aria-label="Remover entorpecente">×</button>`;
      bloco.querySelector(".remover-item").addEventListener("click", () => { bloco.remove(); atualizarListaVazia(recipiente,"Nenhum entorpecente informado."); });
      recipiente.appendChild(bloco);
      atualizarListaVazia(recipiente,"Nenhum entorpecente informado.");
    }
    function adicionarBemSubtraido'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          require(n==1,'Função adicionarEntorpecenteItem não encontrada')
          s=s2

          old='function coletarEntorpecentesItens() { return coletarItens("entorpecentesItens",["tipo","quantidade","unidade","detalhes"]); }'
          new='function coletarEntorpecentesItens() { return coletarItens("entorpecentesItens",["tipo","forma_apresentacao","quantidade","detalhes"]); }'
          require(old in s,'Coletor de entorpecentes não encontrado')
          s=s.replace(old,new,1)

          # Não alimentar mais campos antigos de peso com a quantidade visual.
          legacy='''      const camposDrogas = {"MACONHA":"maconha","COCAÍNA":"cocaina","PASTA BASE":"pastaBase","CRACK":"crack","SKANK":"skank"};
      Object.values(camposDrogas).forEach(id => document.getElementById(id).value = "");
      entorpecentesItens.forEach(item => { const id = camposDrogas[item.tipo]; if (id) document.getElementById(id).value = (Number(document.getElementById(id).value)||0) + item.quantidade; });
'''
          require(legacy in s,'Sincronização legada de drogas não encontrada')
          s=s.replace(legacy,'',1)

          # Dados antigos de peso ficam preservados e não viram itens visuais.
          pattern=r'''      const entorpecentesSalvos = Array\.isArray\(x\.entorpecentes_itens\).*?;\n      const bensSubtraidosSalvos ='''
          replacement='''      const entorpecentesSalvos = Array.isArray(x.entorpecentes_itens) ? x.entorpecentes_itens : [];
      const possuiEntorpecenteLegado = [x.maconha,x.cocaina,x.pasta_base,x.crack,x.skank].some(v=>Number(v)>0);
      const avisoEntorpecentesLegados = document.getElementById("avisoEntorpecentesLegados");
      if (avisoEntorpecentesLegados) avisoEntorpecentesLegados.hidden = !possuiEntorpecenteLegado;
      const bensSubtraidosSalvos ='''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          require(n==1,'Carga de entorpecentes legados não encontrada')
          s=s2

          # Novos salvamentos não escrevem mais nas colunas históricas de peso.
          for key in ['maconha','cocaina','pasta_base','crack','skank']:
              s,n=re.subn(rf'^\s*{key}: document\.getElementById\("[^\"]+"\)\.value \|\| null,\n','',s,count=1,flags=re.M)
              require(n==1,f'Campo legado {key} não encontrado no payload')

          p.write_text(s,encoding='utf-8')

          # ============================================================
          # dashboard.html
          # ============================================================
          p=Path('dashboard.html')
          s=p.read_text(encoding='utf-8')

          old='<label>Companhia<select id="companhia"><option value="">Todas</option><option value="1ª CIA">1ª Companhia</option><option value="2ª CIA">2ª Companhia</option><option value="3ª CIA">3ª Companhia</option></select></label><label>Situação'
          new='<label>Companhia<select id="companhia"><option value="">Todas</option><option value="1ª CIA">1ª Companhia</option><option value="2ª CIA">2ª Companhia</option><option value="3ª CIA">3ª Companhia</option></select></label><label>Município<input id="municipioFiltro" placeholder="Todos"></label><label>Situação'
          require(old in s,'Filtro de companhia não encontrado')
          s=s.replace(old,new,1)

          s=s.replace('if(companhia.value&&x.companhia!==companhia.value)return false;if(status.value', 'if(companhia.value&&x.companhia!==companhia.value)return false;if(municipioFiltro.value&&!norm(x.municipio).toLowerCase().includes(municipioFiltro.value.toLowerCase()))return false;if(status.value',1)
          # segunda ocorrência é filtrarTcos
          s=s.replace('if(companhia.value&&x.companhia!==companhia.value)return false;if(status.value', 'if(companhia.value&&x.companhia!==companhia.value)return false;if(municipioFiltro.value&&!norm(x.municipio).toLowerCase().includes(municipioFiltro.value.toLowerCase()))return false;if(status.value',1)

          old="function detalhesEntorpecentes(registros){let m={};registros.forEach(o=>{let itens=Array.isArray(o.entorpecentes_itens)?o.entorpecentes_itens:[];if(itens.length){itens.forEach(i=>{let tipo=norm(i.tipo),unidade=norm(i.unidade),k=tipo+'|'+unidade;m[k]=(m[k]||0)+num(i.quantidade)})}else{[['MACONHA','maconha'],['COCAÍNA','cocaina'],['PASTA BASE','pasta_base'],['CRACK','crack'],['SKANK','skank']].forEach(([tipo,c])=>{let q=num(o[c]);if(q)m[tipo+'|GRAMA (g)']=(m[tipo+'|GRAMA (g)']||0)+q})}});return Object.entries(m).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(([k,q])=>{let [tipo,unidade]=k.split('|');return[tipo+' — '+unidade,q]})}"
          new="function normalizarTipoEntorpecente(v){let k=chaveOcorrencia(v);if(k==='SKANK')return 'SKUNK';if(['PASTA BASE','LSD','OUTRO'].includes(k))return 'OUTROS';return norm(v)}function tiposEntorpecentesOcorrencia(o){let s=new Set(),itens=Array.isArray(o.entorpecentes_itens)?o.entorpecentes_itens:[];itens.forEach(i=>{if(num(i.quantidade)>0&&i.tipo)s.add(normalizarTipoEntorpecente(i.tipo))});[['MACONHA','maconha'],['COCAÍNA','cocaina'],['OUTROS','pasta_base'],['CRACK','crack'],['SKUNK','skank']].forEach(([tipo,c])=>{if(num(o[c])>0)s.add(tipo)});if(!s.size&&norm(o.entorpecentes)==='SIM')s.add('TIPO NÃO INFORMADO');return [...s]}function temEntorpecente(o){return tiposEntorpecentesOcorrencia(o).length>0}function incidenciaEntorpecentes(registros){let m={};registros.forEach(o=>tiposEntorpecentesOcorrencia(o).forEach(tipo=>m[tipo]=(m[tipo]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}function materiaisEntorpecentes(registros){let m={};registros.forEach(o=>(Array.isArray(o.entorpecentes_itens)?o.entorpecentes_itens:[]).forEach(i=>{let tipo=normalizarTipoEntorpecente(i.tipo),forma=norm(i.forma_apresentacao||i.forma||i.unidade);if(!tipo||!forma||num(i.quantidade)<=0)return;let k=tipo+'|'+forma;m[k]=(m[k]||0)+num(i.quantidade)}));return Object.entries(m).map(([k,q])=>{let[tipo,forma]=k.split('|');return[tipo,forma,q]}).sort((a,b)=>a[0].localeCompare(b[0])||b[2]-a[2])}function detalhesEntorpecentes(registros){return materiaisEntorpecentes(registros).map(x=>[x[0]+' — '+x[1],x[2]])}"
          require(old in s,'Lógica antiga do dashboard de drogas não encontrada')
          s=s.replace(old,new,1)

          old='<section class="section"><h2>Apreensões</h2><p class="sub">Armas, munições, entorpecentes, veículos e trânsito</p><div class="grid3" id="apreensoes"></div></section>\n<section class="section" id="secBensSubtraidos">'
          new='<section class="section"><h2>Apreensões</h2><p class="sub">Armas, munições, entorpecentes, veículos e trânsito</p><div class="grid3" id="apreensoes"></div></section>\n<section class="section" id="secEntorpecentes"><h2>Análise de Entorpecentes</h2><p class="sub">Incidência por ocorrência e quantidades visuais por tipo + forma de apresentação. Pesos não são utilizados.</p><div class="cards" id="cardsEntorpecentes"></div><div class="grid2"><div><h3>Ranking por número de ocorrências</h3><div class="chartbox"><canvas id="chartEntTipos"></canvas></div><div class="tablewrap"><table><thead><tr><th>Tipo</th><th>Ocorrências</th><th>Comparado</th><th>Variação</th></tr></thead><tbody id="tabEntTipos"></tbody></table></div></div><div><h3>Evolução mensal</h3><div class="chartbox"><canvas id="chartEntMes"></canvas></div></div><div><h3>Distribuição por bairro</h3><div class="chartbox"><canvas id="chartEntBairros"></canvas></div></div><div><h3>Distribuição por região de atuação (SISC)</h3><div class="chartbox"><canvas id="chartEntRegiao"></canvas></div></div></div><h3>Quantidade de materiais apreendidos</h3><p class="sub">Apresentações diferentes permanecem separadas; não existe total geral de unidades de droga.</p><div class="tablewrap"><table><thead><tr><th>Tipo</th><th>Forma de apresentação</th><th>Quantidade</th></tr></thead><tbody id="tabEntMateriais"></tbody></table></div></section>\n<section class="section" id="secBensSubtraidos">'
          require(old in s,'Ponto de inserção da análise de entorpecentes não encontrado')
          s=s.replace(old,new,1)

          pattern=r'''let armasDet=detalhesArmas\(a\);let munDet=detalhesMunicoes\(a\);let entDet=detalhesEntorpecentes\(a\),entOcorr=.*?apreensoes\.innerHTML=apr\.map\(x=>`<div class="card">.*?\)\.join\(''\);'''
          replacement="""let armasDet=detalhesArmas(a);let munDet=detalhesMunicoes(a);let entRegistros=a.filter(temEntorpecente),entOcorr=entRegistros.length,entInc=incidenciaEntorpecentes(a),entIncP=Object.fromEntries(incidenciaEntorpecentes(p)),entMat=materiaisEntorpecentes(a),entSemForma=entRegistros.filter(o=>!(Array.isArray(o.entorpecentes_itens)&&o.entorpecentes_itens.length)).length;let apr=[['Armas e simulacros',totalEstruturadoOuLegado(a,'armas_itens','quantidade_armas')+' item(ns)',armasDet],['Munições',totalEstruturadoOuLegado(a,'municoes_itens','quantidade_municoes')+' munição(ões)',munDet],['Entorpecentes',entOcorr+' ocorrência(s)',entInc.slice(0,6).map(x=>[x[0]+' — ocorrência(s)',x[1]])]];apreensoes.innerHTML=apr.map(x=>`<div class="card"><small>${x[0]}</small><strong>${x[1]}</strong><em>${x[2].filter(z=>z[1]).map(z=>esc(z[0])+': '+z[1]).join('<br>')||'Sem detalhamento'}</em></div>`).join('');let topEnt=entInc[0];cardsEntorpecentes.innerHTML=`<div class="card teal"><small>Ocorrências com entorpecentes</small><strong>${entOcorr}</strong><em>${comparar.value==='nenhum'?'':variacao(entOcorr,p.filter(temEntorpecente).length)+' no comparativo'}</em></div><div class="card steel"><small>Maior incidência</small><strong>${topEnt?topEnt[1]:0}</strong><em>${topEnt?esc(topEnt[0]):'Sem registros'}</em></div><div class="card amber"><small>Sem apresentação estruturada</small><strong>${entSemForma}</strong><em>Registros antigos preservados; não entram na soma dos materiais</em></div>`;rows('tabEntTipos',entInc.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td><td>${entIncP[x[0]]||0}</td><td>${variacao(x[1],entIncP[x[0]]||0)}</td></tr>`).join(''));rows('tabEntMateriais',entMat.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${x[2]}</td></tr>`).join(''));chart('chartEntTipos','bar',entInc.slice(0,10).map(x=>x[0]),entInc.slice(0,10).map(x=>x[1]),'Ocorrências',CORES.teal);let entMes=rank(entRegistros,x=>String(x.data_ocorrencia||'').slice(0,7),999).sort((x,y)=>x[0].localeCompare(y[0]));chart('chartEntMes','line',entMes.map(x=>x[0]),entMes.map(x=>x[1]),'Ocorrências com entorpecentes',CORES.steel);let entBairros=rank(entRegistros,x=>normalizarBairro(x.bairro),10);chart('chartEntBairros','bar',entBairros.map(x=>x[0]),entBairros.map(x=>x[1]),'Ocorrências',CORES.blue);let entRegiao=rank(entRegistros,'sisc',10);chart('chartEntRegiao','bar',entRegiao.map(x=>x[0]),entRegiao.map(x=>x[1]),'Ocorrências',CORES.amber);"""
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          require(n==1,'Renderização antiga de entorpecentes não encontrada')
          s=s2

          s=s.replace("g.filter(y=>(Array.isArray(y.entorpecentes_itens)&&y.entorpecentes_itens.some(i=>num(i.quantidade)>0))||norm(y.entorpecentes)==='SIM').length","g.filter(temEntorpecente).length")
          s=s.replace("+'&companhia='+encodeURIComponent(companhia.value);","+'&companhia='+encodeURIComponent(companhia.value)+'&municipio='+encodeURIComponent(municipioFiltro.value)+'&bairro='+encodeURIComponent(bairro.value);")
          p.write_text(s,encoding='utf-8')

          # ============================================================
          # relatorio.html
          # ============================================================
          p=Path('relatorio.html')
          s=p.read_text(encoding='utf-8')

          old='<label>Companhia<select id="companhia"><option value="">Todas</option><option value="1ª CIA">1ª Companhia</option><option value="2ª CIA">2ª Companhia</option><option value="3ª CIA">3ª Companhia</option></select></label><label>Comparar'
          new='<label>Companhia<select id="companhia"><option value="">Todas</option><option value="1ª CIA">1ª Companhia</option><option value="2ª CIA">2ª Companhia</option><option value="3ª CIA">3ª Companhia</option></select></label><label>Município<input id="municipioFiltro" placeholder="Todos"></label><label>Bairro<input id="bairroFiltro" placeholder="Todos"></label><label>Comparar'
          require(old in s,'Toolbar do relatório não encontrada')
          s=s.replace(old,new,1)

          old="function filtrarTerritorio(base){return base.filter(x=>(!sisc.value||x.sisc===sisc.value)&&(!companhia.value||x.companhia===companhia.value))}"
          new="function filtrarTerritorio(base){return base.filter(x=>(!sisc.value||x.sisc===sisc.value)&&(!companhia.value||x.companhia===companhia.value)&&(!municipioFiltro.value||S(x.municipio).toLowerCase().includes(municipioFiltro.value.toLowerCase()))&&(!bairroFiltro.value||S(x.bairro).toLowerCase().includes(bairroFiltro.value.toLowerCase())))}"
          require(old in s,'Filtro territorial do relatório não encontrado')
          s=s.replace(old,new,1)

          marker="function iso(d){return d.toISOString().slice(0,10)}"
          helpers="function normDrug(v){let k=S(v).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase();if(k==='SKANK')return 'SKUNK';if(['PASTA BASE','LSD','OUTRO'].includes(k))return 'OUTROS';return S(v)}function drugTypes(o){let z=new Set(),it=Array.isArray(o.entorpecentes_itens)?o.entorpecentes_itens:[];it.forEach(i=>{if(N(i.quantidade)>0&&i.tipo)z.add(normDrug(i.tipo))});[['MACONHA','maconha'],['COCAÍNA','cocaina'],['OUTROS','pasta_base'],['CRACK','crack'],['SKUNK','skank']].forEach(([t,c])=>{if(N(o[c])>0)z.add(t)});if(!z.size&&S(o.entorpecentes)==='SIM')z.add('TIPO NÃO INFORMADO');return [...z]}function hasDrug(o){return drugTypes(o).length>0}function drugIncidence(d){let m={};d.forEach(o=>drugTypes(o).forEach(t=>m[t]=(m[t]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}function drugMaterials(d){let m={};d.forEach(o=>(Array.isArray(o.entorpecentes_itens)?o.entorpecentes_itens:[]).forEach(i=>{let t=normDrug(i.tipo),f=S(i.forma_apresentacao||i.forma||i.unidade);if(!t||!f||N(i.quantidade)<=0)return;let k=t+'|'+f;m[k]=(m[k]||0)+N(i.quantidade)}));return Object.entries(m).map(([k,q])=>{let[t,f]=k.split('|');return[t,f,q]}).sort((a,b)=>a[0].localeCompare(b[0])||b[2]-a[2])}\n"
          require(marker in s,'Marcador de helpers do relatório não encontrado')
          s=s.replace(marker,helpers+marker,1)

          # Todas as contagens de ocorrências com drogas usam a mesma definição.
          s=s.replace("d.filter(x=>S(x.entorpecentes)==='SIM').length","d.filter(hasDrug).length")
          s=s.replace("g.filter(y=>S(y.entorpecentes)==='SIM').length","g.filter(hasDrug).length")

          old="let white=spec(d.map(x=>x.arma_branca).filter(Boolean).join(';'));let p9=page('',`<h3 class=\"subtitle\">APREENSÕES DE ARMA BRANCA</h3>"
          new="let drugInc=drugIncidence(d),drugIncOld=Object.fromEntries(drugIncidence(old)),drugMat=drugMaterials(d),drugSemForma=d.filter(hasDrug).filter(o=>!(Array.isArray(o.entorpecentes_itens)&&o.entorpecentes_itens.length)).length;let white=spec(d.map(x=>x.arma_branca).filter(Boolean).join(';'));let p9=page('',`<h3 class=\"subtitle\">ENTORPECENTES — INCIDÊNCIA POR OCORRÊNCIA</h3>${table(['TIPO','OCORRÊNCIAS','COMPARADO','VARIAÇÃO'],drugInc.map(x=>`<tr><td>${E(x[0])}</td><td>${x[1]}</td><td>${drugIncOld[x[0]]||0}</td><td>${variance(x[1],drugIncOld[x[0]]||0)}</td></tr>`),`<tr class=\"total\"><td>TOTAL DE OCORRÊNCIAS COM ENTORPECENTES</td><td>${d.filter(hasDrug).length}</td><td>${old.filter(hasDrug).length}</td><td>${variance(d.filter(hasDrug).length,old.filter(hasDrug).length)}</td></tr>`)}<h3 class=\"subtitle\">ENTORPECENTES — QUANTIDADE VISUAL POR APRESENTAÇÃO</h3>${table(['TIPO','FORMA DE APRESENTAÇÃO','QUANTIDADE'],drugMat.map(x=>`<tr><td>${E(x[0])}</td><td>${E(x[1])}</td><td>${x[2]}</td></tr>`))}<p class=\"small\"><b>Regra institucional:</b> não são utilizados pesos ou medidas. ${drugSemForma} ocorrência(s) antiga(s)/sem apresentação estruturada foram preservadas e não entram nas somas de materiais.</p><h3 class=\"subtitle\">APREENSÕES DE ARMA BRANCA</h3>"
          require(old in s,'Página de arma branca do relatório não encontrada')
          s=s.replace(old,new,1)

          s=s.replace("'Apreensões de Munições','Apreensões de Arma Branca'","'Apreensões de Munições','Apreensões de Entorpecentes','Apreensões de Arma Branca'",1)

          old="comparar.value=q.get('comparar')||'ano';sisc.value=q.get('sisc')||'';companhia.value=q.get('companhia')||'';"
          new="comparar.value=q.get('comparar')||'ano';sisc.value=q.get('sisc')||'';companhia.value=q.get('companhia')||'';municipioFiltro.value=q.get('municipio')||'';bairroFiltro.value=q.get('bairro')||'';"
          require(old in s,'Inicialização de filtros do relatório não encontrada')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

      - name: Validar
        run: |
          grep -q 'FORMAS_ENTORPECENTES' cadastro.html
          ! grep -q 'UNIDADES_ENTORPECENTES' cadastro.html
          ! grep -q 'GRAMA (g).*QUILOGRAMA' cadastro.html
          grep -q 'forma_apresentacao' cadastro.html
          grep -q 'Análise de Entorpecentes' dashboard.html
          grep -q 'incidenciaEntorpecentes' dashboard.html
          grep -q 'Evolução mensal' dashboard.html
          grep -q 'Distribuição por região de atuação' dashboard.html
          grep -q 'ENTORPECENTES — INCIDÊNCIA POR OCORRÊNCIA' relatorio.html
          grep -q 'não são utilizados pesos ou medidas' relatorio.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cadastro.html dashboard.html relatorio.html
          git commit -m "Implementa entorpecentes por apresentação visual sem peso"
          git push
