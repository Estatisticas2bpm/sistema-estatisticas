name: Corrigir migração auth segura v2

on:
  push:
    paths:
      - '.github/workflows/corrigir-migracao-auth-segura-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir arquivo SQL
        shell: python
        run: |
          from pathlib import Path
          p=Path('migrations/20260824_autenticacao_perfis_acesso.sql')
          s=p.read_text(encoding='utf-8')

          s=s.replace("if current_user in ('postgres','service_role') or v_role = 'service_role' then", "if v_role='service_role' or (v_role='' and current_user='postgres') then")
          s=s.replace("if current_user in ('postgres','service_role') or v_role='service_role' then", "if v_role='service_role' or (v_role='' and current_user='postgres') then")

          old_drop="""    execute (
      select coalesce(string_agg(format('drop policy if exists %I on public.%I;',policyname,t),' '),'')
      from pg_policies where schemaname='public' and tablename=t
    );"""
          new_drop="""    for pol in select policyname from pg_policies where schemaname='public' and tablename=t loop
      execute format('drop policy if exists %I on public.%I',pol.policyname,t);
    end loop;"""
          if s.count(old_drop) != 2:
            raise SystemExit(f'Esperava 2 blocos de políticas; encontrei {s.count(old_drop)}')
          s=s.replace(old_drop,new_drop)

          op_decl="""do $$
declare
  t text;
begin
  foreach t in array array['ocorrencias','tcos','acoes_preventivas'] loop"""
          op_new="""do $$
declare
  t text;
  pol record;
begin
  foreach t in array array['ocorrencias','tcos','acoes_preventivas'] loop"""
          if op_decl not in s: raise SystemExit('Declare operacional não encontrado')
          s=s.replace(op_decl,op_new,1)

          cat_decl="""do $$
declare
  t text;
begin
  foreach t in array array['bairros','comandantes','enderecos_padronizados','locais_apresentacao','subtipos_ocorrencia','tipos_ocorrencia'] loop"""
          cat_new="""do $$
declare
  t text;
  pol record;
begin
  foreach t in array array['bairros','comandantes','enderecos_padronizados','locais_apresentacao','subtipos_ocorrencia','tipos_ocorrencia'] loop"""
          if cat_decl not in s: raise SystemExit('Declare catálogo não encontrado')
          s=s.replace(cat_decl,cat_new,1)

          old_ctrl="""  if private.perfil_atual() not in ('ADMIN','ESTATISTICA') then
    raise exception 'Seu perfil não possui permissão para alterar catálogos.' using errcode='42501';
  end if;
  if tg_op='DELETE' then return old; else return new; end if;"""
          new_ctrl="""  if tg_op='INSERT' then
    if private.perfil_atual() not in ('ADMIN','ESTATISTICA','OPERADOR') then
      raise exception 'Seu perfil não possui permissão para cadastrar itens de catálogo.' using errcode='42501';
    end if;
    return new;
  end if;
  if private.perfil_atual() not in ('ADMIN','ESTATISTICA') then
    raise exception 'Seu perfil não possui permissão para editar ou excluir catálogos.' using errcode='42501';
  end if;
  if tg_op='DELETE' then return old; else return new; end if;"""
          if old_ctrl not in s: raise SystemExit('Controle catálogo não encontrado')
          s=s.replace(old_ctrl,new_ctrl,1)

          old_pol="""    execute format('create policy %I on public.%I for select to authenticated using (private.usuario_ativo())','auth_'||t||'_select',t);
    execute format('create policy %I on public.%I for all to authenticated using (private.pode_administrar_dados()) with check (private.pode_administrar_dados())','auth_'||t||'_admin',t);"""
          new_pol="""    execute format('create policy %I on public.%I for select to authenticated using (private.usuario_ativo())','auth_'||t||'_select',t);
    execute format('create policy %I on public.%I for insert to authenticated with check (private.pode_escrever_operacional())','auth_'||t||'_insert',t);
    execute format('create policy %I on public.%I for update to authenticated using (private.pode_administrar_dados()) with check (private.pode_administrar_dados())','auth_'||t||'_update',t);
    execute format('create policy %I on public.%I for delete to authenticated using (private.pode_administrar_dados())','auth_'||t||'_delete',t);"""
          if old_pol not in s: raise SystemExit('Políticas catálogo não encontradas')
          s=s.replace(old_pol,new_pol,1)

          if "current_user in ('postgres','service_role')" in s:
            raise SystemExit('Ainda existe bypass inseguro por current_user')
          if s.count('pol record;') != 2:
            raise SystemExit('Declaração pol record incompleta')
          p.write_text(s,encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/20260824_autenticacao_perfis_acesso.sql
          git commit -m "Corrige segurança final da migração de acesso"
          git push
