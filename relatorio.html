function nomeCipturRel(){
  return 'Companhia Independente de Policiamento de Trânsito Urbano e Rodoviário - CIPTUR';
}

function pageCiptur(title,body){
  const periodo=periodoRelatorio(ini.value,fim.value);
  return `<section class="page"><div class="internal-head">${periodo.titulo}<br>${E(nomeCipturRel()).toUpperCase()}</div>${title?`<h2 class="title">${title}</h2>`:''}${body}<div class="footer"></div></section>`;
}

function chaveRelCiptur(v){
  return S(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
}

function nomeNaturezaRelCiptur(v){
  const original=S(v),k=chaveRelCiptur(original);
  if(k.includes('MARIA DA PENHA')||k.includes('VIOLENCIA DOMESTICA'))return 'MARIA DA PENHA / VIOLÊNCIA DOMÉSTICA';
  return original;
}

function naturezasRelCiptur(x){
  let lista=[];
  if(x&&x.ocorrencia)lista.push(x.ocorrencia);
  if(Array.isArray(x&&x.naturezas_itens))x.naturezas_itens.forEach(n=>lista.push(typeof n==='string'?n:(n&&n.nome)||(n&&n.tipo)||''));
  const unicas=[];
  lista.map(nomeNaturezaRelCiptur).filter(v=>v&&!ehNaoInformadoRel(v)).forEach(v=>{if(!unicas.includes(v))unicas.push(v)});
  return unicas;
}

function rankNaturezasRelCiptur(registros,limit=999){
  const m={};
  registros.forEach(o=>naturezasRelCiptur(o).forEach(n=>m[n]=(m[n]||0)+1));
  return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,limit);
}

function grupamentoOperacionalRel(x){
  const texto=String((x&&x.observacao_final)||''),marcador='[[PESSOAS_ENVOLVIDAS]]',pos=texto.lastIndexOf(marcador);
  if(pos<0)return '';
  try{return chaveRelCiptur(JSON.parse(texto.slice(pos+marcador.length)).grupamento_atendimento||'')}catch(_){return ''}
}

function ehTorRel(x){return grupamentoOperacionalRel(x)==='TOR'}
