name: Corrigir releitura direta da Auditoria

on:
  push:
    paths:
      - '.github/workflows/fix-auditoria-refresh-direto.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Completar releitura direta
        shell: python
        run: |
          from pathlib import Path

          p = Path('auditoria.html')
          s = p.read_text(encoding='utf-8')

          old = "const corrigidoId=new URLSearchParams(location.search).get('corrigido_id');\n if(corrigidoId){"
          new = "let qsCorrecao=new URLSearchParams(location.search),corrigidoId=qsCorrecao.get('corrigido_id'),corrigidoBo=qsCorrecao.get('corrigido');\n if(!corrigidoId&&corrigidoBo){const alvo=dados.find(o=>chave(o.numero_bo)===chave(corrigidoBo));if(alvo&&alvo.id!=null)corrigidoId=String(alvo.id)}\n if(corrigidoId){"
          if old not in s:
              raise SystemExit('Trecho de releitura direta não encontrado')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Validar
        run: |
          grep -q "corrigidoBo" auditoria.html
          grep -q "obter_ocorrencia_publica" auditoria.html
          grep -q "corrigido_id" auditoria.html

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria.html
          git commit -m "Relê BO corrigido diretamente na Auditoria"
          git push
