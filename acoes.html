<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ações preventivas e sociais</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef2f6;color:#1f2937}header{background:#132b46;color:white;padding:22px}.top,main{max-width:1000px;width:94%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.top h1{margin:0}.top a{color:white}.box{background:white;margin-top:22px;padding:22px;border-radius:12px;box-shadow:0 4px 15px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{font-weight:bold;font-size:14px}input,select,textarea{width:100%;padding:10px;margin-top:6px;border:1px solid #d7e0ea;border-radius:7px;font:inherit}textarea{min-height:90px}.full{grid-column:1/-1}button{background:#2556d8;color:white;border:0;border-radius:8px;padding:12px 18px;font-size:15px;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><div class="top"><h1>Ações preventivas e sociais</h1><a href="index.html">← Início</a></div></header><main><section class="box"><h2>Novo registro</h2><form id="f" class="grid"><label>Data *<input id="data" type="date" required></label><label>Tipo *<select id="tipo" required><option>VISITA COMUNITÁRIA</option><option>VISITA SOLIDÁRIA</option><option>PALESTRA EM ESCOLA</option><option>OUTRA AÇÃO PREVENTIVA</option></select></label><label>Quantidade<input id="qtd" type="number" min="1" value="1"></label><label>Localidade<input id="local"></label><label class="full">Descrição<textarea id="desc"></textarea></label><label class="full">Links das fotos, separados por vírgula<textarea id="fotos" placeholder="https://..."></textarea></label><div class="full"><button>Salvar ação</button></div></form></section><section class="box"><h2>Ações registradas</h2><table><thead><tr><th>Data</th><th>Tipo</th><th>Quantidade</th><th>Local</th></tr></thead><tbody id="lista"></tbody></table></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://jppmhhukujigxupgskdk.supabase.co","sb_publishable_ZVnU35i2x9zwppQqYg7UYw_mzaT43aG");data.value=new Date().toISOString().slice(0,10);async function carregar(){var r=await db.rpc("obter_acoes_preventivas",{data_inicio:null,data_fim:null});var a=r.data||[];lista.innerHTML=a.map(function(x){return "<tr><td>"+x.data_acao+"</td><td>"+x.tipo_acao+"</td><td>"+x.quantidade+"</td><td>"+(x.localidade||"—")+"</td></tr>"}).join("")}f.onsubmit=async function(e){e.preventDefault();var registro={data_acao:data.value,tipo_acao:tipo.value,quantidade:Number(qtd.value)||1,localidade:local.value||null,descricao:desc.value||null,fotos:fotos.value?fotos.value.split(",").map(function(x){return x.trim()}).filter(Boolean):null};var r=await db.from("acoes_preventivas").insert([registro]);if(r.error){alert("Erro: "+r.error.message);return}alert("Ação salva com sucesso!");f.reset();data.value=new Date().toISOString().slice(0,10);qtd.value=1;carregar()};carregar();</script></body></html>
