name: Relacionar AME no dashboard

on:
  push:
    paths:
      - '.github/workflows/relacionar-ame-dashboard.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar classificação AME no filtro
        shell: python
        run: |
          from pathlib import Path

          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')

          marcador = 'function filtrar(base){'
          helper = "function ehAme(x){if(x&&x.ame===true)return true;const k=v=>String(v||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase();const rel=v=>{let t=k(v);return t.includes('MARIA DA PENHA')||t.includes('VIOLENCIA DOMESTICA')};if(rel(x?.ocorrencia)||rel(x?.crime))return true;let ns=Array.isArray(x?.naturezas_itens)?x.naturezas_itens:[];if(ns.some(n=>Number(n?.tipo_id)===1||rel(n?.nome||n?.tipo)||(Array.isArray(n?.subtipos)&&n.subtipos.some(z=>rel(z?.nome)))))return true;let cs=Array.isArray(x?.crimes_itens)?x.crimes_itens:[];return cs.some(c=>Number(c?.tipo_id)===1||rel(c?.tipo_nome)||rel(c?.nome))}"
          if 'function ehAme(x)' not in s:
            if marcador not in s:
              raise SystemExit('Função filtrar não encontrada')
            s = s.replace(marcador, helper + marcador, 1)

          antigo = "if(documento.value&&x.tipo_registro!==documento.value)return false;"
          novo = "if(documento.value==='AME'&&!ehAme(x))return false;if(documento.value==='TS'&&!x.tatico_setorial)return false;if(documento.value&&!['AME','TS'].includes(documento.value)&&x.tipo_registro!==documento.value)return false;"
          if antigo in s:
            s = s.replace(antigo, novo, 1)
          elif novo not in s:
            raise SystemExit('Regra de filtro por documento/equipe não encontrada')

          s = s.replace('<label>Tipo de documento/equipe<select id="documento">','<label>Documento / classificação<select id="documento">',1)

          p.write_text(s, encoding='utf-8')

      - name: Validar
        run: |
          grep -q "function ehAme(x)" dashboard.html
          grep -q "documento.value==='AME'" dashboard.html
          grep -q "Documento / classificação" dashboard.html

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Relaciona Maria da Penha e violência doméstica à AME"
          git push
