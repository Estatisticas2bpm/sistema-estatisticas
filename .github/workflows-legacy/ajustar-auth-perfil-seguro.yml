name: Ajustar consulta segura do perfil

on:
  push:
    paths:
      - '.github/workflows/ajustar-auth-perfil-seguro.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajustar Edge Function e guard
        shell: python
        run: |
          from pathlib import Path
          import re

          # Edge Function: ação "me" para consultar o próprio perfil via backend privilegiado.
          p=Path('supabase/functions/admin-users/index.ts')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
            '.select("user_id,nome,nome_guerra,email,perfil,ativo,senha_temporaria,unidade_id")',
            '.select("user_id,nome,nome_guerra,matricula,email,perfil,ativo,senha_temporaria,unidade_id,unidades(id,sigla,nome)")',
            1
          )
          marker='''    const action = limpar(body.action);\n\n    if (action === "bootstrap") {'''
          insert='''    const action = limpar(body.action);\n\n    if (action === "me") {\n      const perfil = await perfilDoUsuario(caller.id);\n      return resposta({ profile: perfil || null });\n    }\n\n    if (action === "bootstrap") {'''
          if 'action === "me"' not in s:
            if marker not in s: raise SystemExit('Marcador da Edge Function não encontrado')
            s=s.replace(marker,insert,1)
          p.write_text(s,encoding='utf-8')

          # Guard: primeiro consulta perfil pela Edge Function; bootstrap apenas se ainda não existir perfil algum.
          p=Path('auth-guard.js')
          s=p.read_text(encoding='utf-8')
          pattern=re.compile(r'''  async function carregarPerfil\(client,user\)\{[\s\S]*?\n  \}\n\n  const ready=''')
          novo='''  async function carregarPerfil(client,user){\n    const me=await client.functions.invoke(cfg.adminFunction,{body:{action:'me'}});\n    if(me.error)throw me.error;\n    if(me.data?.profile)return me.data.profile;\n\n    const boot=await client.functions.invoke(cfg.adminFunction,{body:{action:'bootstrap'}});\n    if(boot.error)throw boot.error;\n    if(boot.data?.error)throw new Error(boot.data.error);\n    return boot.data?.profile||null;\n  }\n\n  const ready='''
          s,n=pattern.subn(novo,s,count=1)
          if n!=1: raise SystemExit('Função carregarPerfil não encontrada')
          p.write_text(s,encoding='utf-8')

      - name: Validar
        run: |
          grep -q 'action === "me"' supabase/functions/admin-users/index.ts
          grep -q "action:'me'" auth-guard.js

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/admin-users/index.ts auth-guard.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Consulta perfil de acesso pela Edge Function"
          git push
