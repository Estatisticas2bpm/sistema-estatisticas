<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ações Preventivas</title>
<style>
:root{--navy:#071b33;--blue:#0e4f8a;--cyan:#18a0ae;--ink:#17263a;--muted:#657489;--bg:#edf2f7;--green:#14845f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}.head{background:linear-gradient(120deg,#06182e,#0d4e78);color:#fff;padding:25px 6% 65px}.head a{color:#bee6ef;text-decoration:none;font-size:13px}.head h1{margin:25px 0 6px;font-size:34px}.head p{margin:0;color:#c4d7e6}.wrap{width:min(1120px,92%);margin:-38px auto 45px}.grid{display:grid;grid-template-columns:390px 1fr;gap:18px}.card{background:#fff;border-radius:20px;padding:23px;box-shadow:0 10px 30px rgba(15,43,72,.09)}h2{font-size:18px;margin:0 0 18px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:800;color:#45566c;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #d6e0e9;border-radius:11px;padding:11px 12px;font:inherit;background:#fff}textarea{min-height:85px;resize:vertical}.row{display:grid;grid-template-columns:1fr 110px;gap:10px}.upload{border:2px dashed #b8ccdd;border-radius:14px;background:#f7fbfe;padding:18px;text-align:center;cursor:pointer;transition:.2s}.upload:hover{border-color:var(--cyan);background:#f1fbfb}.upload span{display:block;font-size:29px;margin-bottom:6px}.upload b{font-size:13px}.upload small{display:block;color:var(--muted);margin-top:5px}.upload input{display:none}.previews{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.preview{aspect-ratio:1;border-radius:9px;overflow:hidden;position:relative;background:#e4ebf1}.preview img{width:100%;height:100%;object-fit:cover}.preview i{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.65);color:#fff;border-radius:9px;padding:2px 5px;font-size:10px;font-style:normal}.btn{width:100%;border:0;border-radius:12px;padding:13px;background:linear-gradient(100deg,var(--blue),var(--cyan));color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.status{font-size:12px;color:var(--muted);margin:9px 0 0;text-align:center}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.action{border:1px solid #e0e7ee;border-radius:16px;overflow:hidden;background:#fff}.cover{height:155px;background:linear-gradient(130deg,#d9e7f2,#c6e2e3);position:relative;display:grid;place-items:center;color:#52708c}.cover img{width:100%;height:100%;object-fit:cover}.cover .more{position:absolute;right:9px;bottom:9px;background:rgba(5,24,45,.76);color:#fff;padding:5px 8px;border-radius:14px;font-size:11px}.info{padding:14px}.date{font-size:11px;color:var(--blue);font-weight:900;text-transform:uppercase}.info h3{font-size:14px;margin:6px 0}.meta{font-size:12px;color:var(--muted)}.desc{font-size:12px;line-height:1.45;color:#445469;margin:9px 0 0}.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.gallery{grid-template-columns:1fr 1fr}}@media(max-width:520px){.gallery{grid-template-columns:1fr}.row{grid-template-columns:1fr}.head h1{font-size:28px}}
</style></head><body><header class="head"><a href="index.html">← Voltar ao início</a><h1>Ações preventivas e sociais</h1><p>Cadastre as atividades da unidade e mantenha as fotografias organizadas.</p></header>
<main class="wrap"><div class="grid"><section class="card"><h2>Nova ação</h2><form id="formAcao"><div class="row"><div class="field"><label>Data *</label><input id="dataAcao" type="date" required></div><div class="field"><label>Quantidade</label><input id="quantidade" type="number" min="1" value="1"></div></div><div class="field"><label>Tipo de ação *</label><select id="tipoAcao" required><option>VISITA COMUNITÁRIA</option><option>AÇÃO SOCIAL</option><option>PALESTRA</option><option>REUNIÃO</option><option>VISITA INSTITUCIONAL</option><option>ATIVIDADE PREVENTIVA</option><option>OUTRA AÇÃO PREVENTIVA</option></select></div><div class="field"><label>Localidade</label><input id="localidade" placeholder="Bairro, escola ou instituição"></div><div class="field"><label>Descrição</label><textarea id="descricao" placeholder="Descreva brevemente a atividade realizada"></textarea></div><div class="field"><label>Fotografias</label><label class="upload" for="arquivos"><span>📷</span><b>Selecionar fotos do computador</b><small>JPEG, PNG ou WebP — até 10 MB cada</small><input id="arquivos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="previews" class="previews"></div></div><button id="salvar" class="btn">Salvar ação e fotografias</button><p id="status" class="status"></p></form></section>
<section class="card"><h2>Galeria de ações registradas</h2><div id="galeria" class="gallery"><div class="empty">Carregando ações...</div></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://jppmhhukujigxupgskdk.supabase.co","sb_publishable_ZVnU35i2x9zwppQqYg7UYw_mzaT43aG");var selectedFiles=[];dataAcao.value=new Date().toISOString().slice(0,10);
function fotosArray(v){if(!v)return[];if(Array.isArray(v))return v;try{var a=JSON.parse(v);return Array.isArray(a)?a:[]}catch(e){return String(v).split(",").map(function(x){return x.trim()}).filter(Boolean)}}
arquivos.onchange=function(){selectedFiles=Array.from(this.files||[]);previews.innerHTML=selectedFiles.map(function(f,i){return '<div class="preview"><img src="'+URL.createObjectURL(f)+'"><i>'+(i+1)+'</i></div>'}).join("")};
async function carregar(){var r=await db.rpc("obter_acoes_preventivas",{data_inicio:null,data_fim:null});var a=r.data||[];galeria.innerHTML=a.length?a.map(function(x){var fs=fotosArray(x.fotos),cover=fs.length?'<img src="'+fs[0]+'" alt="Foto da ação">':'<span>📷 Sem fotografia</span>';return '<article class="action"><div class="cover">'+cover+(fs.length>1?'<span class="more">+'+(fs.length-1)+' fotos</span>':'')+'</div><div class="info"><span class="date">'+new Date(x.data_acao+"T12:00:00").toLocaleDateString("pt-BR")+'</span><h3>'+x.tipo_acao+'</h3><div class="meta">'+(x.localidade||"Local não informado")+' · '+(x.quantidade||1)+' registro(s)</div>'+(x.descricao?'<p class="desc">'+x.descricao+'</p>':'')+'</div></article>'}).join(""):'<div class="empty">Nenhuma ação cadastrada ainda.</div>'}
formAcao.onsubmit=async function(e){e.preventDefault();salvar.disabled=true;status.textContent=selectedFiles.length?"Enviando fotografias...":"Salvando ação...";var urls=[];for(var i=0;i<selectedFiles.length;i++){var f=selectedFiles[i];if(f.size>10485760){alert("A foto "+f.name+" ultrapassa 10 MB.");salvar.disabled=false;return}var ext=(f.name.split(".").pop()||"jpg").toLowerCase(),path=dataAcao.value+"/"+Date.now()+"-"+i+"."+ext;var up=await db.storage.from("fotos-acoes").upload(path,f,{contentType:f.type,upsert:false});if(up.error){alert("Não foi possível enviar "+f.name+": "+up.error.message);salvar.disabled=false;return}urls.push(db.storage.from("fotos-acoes").getPublicUrl(path).data.publicUrl)}status.textContent="Salvando os dados...";var registro={data_acao:dataAcao.value,tipo_acao:tipoAcao.value,quantidade:Number(quantidade.value)||1,localidade:localidade.value||null,descricao:descricao.value||null,fotos:urls.length?urls:null};var r=await db.from("acoes_preventivas").insert([registro]);if(r.error){alert("Erro ao salvar: "+r.error.message);salvar.disabled=false;return}alert("Ação e fotografias salvas com sucesso!");formAcao.reset();selectedFiles=[];previews.innerHTML="";dataAcao.value=new Date().toISOString().slice(0,10);quantidade.value=1;status.textContent="";salvar.disabled=false;carregar()};carregar();
</script></body></html>
