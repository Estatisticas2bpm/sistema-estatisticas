          # CADASTRO
          # ==============================================================
          p=Path('cadastro.html')
          s=p.read_text(encoding='utf-8')

          s=replace_once(s,
            '<div><h3>Substâncias apreendidas</h3><small>Cadastre somente quando houver apreensão.</small></div>',
            '<div><h3>Substâncias apreendidas</h3><small>Registre somente o que foi visualmente constatado: tipo, forma de apresentação e quantidade de unidades. Não informe peso (g, kg ou mg).</small></div>',
            'cadastro.html')

          s=replace_once(s,
            '<div class="lista-itens" id="entorpecentesItens"><p class="lista-vazia">Nenhum entorpecente informado.</p></div>',
            '<div id="avisoEntorpecentesLegados" hidden style="margin-bottom:12px;padding:12px;border:1px solid #f59e0b;border-radius:9px;background:#fffbeb;color:#92400e"><strong>Registro legado:</strong> esta ocorrência possui dados antigos de entorpecentes registrados em peso. Eles foram preservados no banco, mas não serão convertidos nem somados como unidades visuais.</div><div class="lista-itens" id="entorpecentesItens"><p class="lista-vazia">Nenhum entorpecente informado.</p></div>',
            'cadastro.html')

          s=replace_once(s,
            'const TIPOS_ENTORPECENTES = ["MACONHA","COCAÍNA","PASTA BASE","CRACK","SKANK","ECSTASY","LSD","OUTRO"];\n    const UNIDADES_ENTORPECENTES = ["GRAMA (g)","QUILOGRAMA (kg)","UNIDADE","PORÇÃO","INVÓLUCRO","OUTRO"];',
            'const TIPOS_ENTORPECENTES = ["MACONHA","COCAÍNA","CRACK","SKUNK","ECSTASY","OUTROS"];\n    const FORMAS_ENTORPECENTES = ["INVÓLUCRO","PORÇÃO","TABLETE","TIJOLO","PAPELOTE","PINO","COMPRIMIDO","SACOLA","OUTROS"];',
            'cadastro.html')

          antigo='''        const tipoDroga = TIPOS_ENTORPECENTES.filter(t=>t!=="OUTRO").find(t=>chave.includes(textoComparavel(t)));
