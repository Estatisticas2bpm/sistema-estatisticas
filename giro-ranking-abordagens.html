<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIRO — Produtividade por militar</title><style>body{font:15px system-ui;margin:0;background:#eef3f8;color:#173047}header{background:#071b33;color:white;padding:22px}main{max-width:960px;margin:20px auto;padding:12px}section{background:white;border-radius:14px;padding:20px}label{display:inline-block;margin:8px}input{display:block;padding:10px}button{padding:12px;border:0;border-radius:8px;background:#0e4f8a;color:white}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #dde6ef;text-align:left}th{background:#eef3f8}a{color:inherit}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-config.js"></script><script src="auth-guard.js"></script></head><body><header><h1>GIRO · Ranking de abordagens por policial</h1><a href="giro-acesso-abordagens.html">← Gestão de policiais</a></header><main><section><p>Produtividade individual vinculada à conta que salvou a abordagem. Os registros históricos da antiga conta compartilhada não são atribuídos a policiais específicos.</p><form id="f"><label>Data inicial<input id="inicio" type="date" required></label><label>Data final<input id="fim" type="date" required></label><button type="submit">Atualizar ranking</button></form><p id="status" role="status"></p><table><thead><tr><th>Posição</th><th>Policial</th><th>Matrícula</th><th>Abordagens</th><th>Pessoas abordadas</th></tr></thead><tbody id="linhas"></tbody></table></section></main><script>
(async()=>{const $=id=>document.getElementById(id),auth=await window.SistemaAuth.ready,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));const d=new Date(),iso=x=>x.toISOString().slice(0,10);$('inicio').value=iso(new Date(d.getFullYear(),d.getMonth(),1));$('fim').value=iso(d);if(!auth?.client){$('status').textContent='Sem acesso autorizado.';return}
async function atualizar(){const fim=new Date($('fim').value+'T12:00:00');fim.setDate(fim.getDate()+1);const {data,error}=await auth.client.rpc('giro_ranking_militares',{p_inicio:$('inicio').value+'T00:00:00-04:00',p_fim:iso(fim)+'T00:00:00-04:00'});if(error)throw error;const rows=data||[];$('status').textContent=rows.length+' militar(es) com abordagens no período.';$('linhas').innerHTML=rows.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.nome_guerra)+'<small style="display:block">'+esc(x.nome_completo)+'</small></td><td>'+esc(x.matricula)+'</td><td>'+Number(x.quantidade_abordagens||0)+'</td><td>'+Number(x.pessoas_abordadas||0)+'</td></tr>').join('')}
$('f').onsubmit=async e=>{e.preventDefault();try{await atualizar()}catch(e){$('status').textContent=e.message}};try{await atualizar()}catch(e){$('status').textContent=e.message}
})();
</script></body></html>
