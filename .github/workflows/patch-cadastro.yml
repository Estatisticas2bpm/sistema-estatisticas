name: Ajuste cadastro
on:
  push:
    paths:
      - '.github/workflows/patch-cadastro.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar cadastro
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cadastro.html')
          s=p.read_text(encoding='utf-8')
          # Se a versão completa ainda não estiver restaurada, recupera do commit anterior seguro.
          import subprocess
          subprocess.run(['git','show','1fe42d2ae7a964db3451c48522457854e4d638f9:cadastro.html'],stdout=open('/tmp/cadastro-original.html','wb'),check=True)
          s=Path('/tmp/cadastro-original.html').read_text(encoding='utf-8')
          for trecho in [
              '              <option>ROP</option>\n',
              '              <option>TCO</option>\n',
              '              <option>NI — Não Informado</option>\n',
              '              <option value="NI">NI — Não Informado</option>\n',
              '<option>NI — Não Informado</option>',
              '<option value="NI">NI — Não Informado</option>'
          ]:
              s=s.replace(trecho,'')
          s=s.replace('<label for="numeroBo">Nº BO/ROP *</label>','<label for="numeroBo">Nº BO *</label>')
          s=s.replace('Informe o número do BO/ROP.','Informe o número do BO.')
          old='tipo_registro: tratarNI(document.getElementById("tipoRegistro").value),'
          new='tipo_registro: document.getElementById("tipoRegistro").value || (idEdicao && registroOriginalEdicao ? registroOriginalEdicao.tipo_registro : null),'
          if old not in s:
              raise SystemExit('Trecho tipo_registro não encontrado')
          s=s.replace(old,new)
          old2='tatico_setorial: document.getElementById("tipoRegistro").value === "TS",'
          new2='tatico_setorial: (document.getElementById("tipoRegistro").value || (idEdicao && registroOriginalEdicao ? registroOriginalEdicao.tipo_registro : "")) === "TS",'
          if old2 not in s:
              raise SystemExit('Trecho tatico_setorial não encontrado')
          s=s.replace(old2,new2)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'Estatisticas2bpm'
          git config user.email 'bpmsgteverto@gmail.com'
          git add cadastro.html
          git commit -m 'Limpa NI e simplifica tipos no cadastro'
          git push
