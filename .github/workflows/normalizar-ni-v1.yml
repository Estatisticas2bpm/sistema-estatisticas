name: Normalizar NI e perfis estatisticos

on:
  push:
    branches: [main]
    paths:
      - 'trigger-ni-run.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Corrigir tratamento de NI
        shell: python
        run: |
          from pathlib import Path
          import re

          # DASHBOARD
          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')

          pat = r"function rank\(a,c,limit=999\)\{.*?\}function soma"
          rep = """function ehNaoInformado(v){let k=String(v??'').trim().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase();return !k||['NI','N/I','N','NA','NAO INFORMADO','NÃO INFORMADO'].includes(k)}function rank(a,c,limit=999){let m={};a.forEach(x=>{let bruto=typeof c==='function'?c(x):x[c];if(ehNaoInformado(bruto))return;let k=String(bruto).trim();m[k]=(m[k]||0)+1});return Object.entries(m).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0])).slice(0,limit)}function soma"""
          s,n = re.subn(pat,rep,s,count=1,flags=re.S)
          if n != 1: raise SystemExit('rank dashboard nao encontrado')

          s = s.replace("if(k==='NI'||k==='NAO INFORMADO')return 'NI';", "if(k==='NI'||k==='N'||k==='NA'||k==='NAO INFORMADO')return 'NI';", 1)
          s = s.replace("if(k==='NI'||k==='NAO INFORMADO'||k==='NÃO INFORMADO')return 'NI';", "if(k==='NI'||k==='N'||k==='NA'||k==='NAO INFORMADO'||k==='NÃO INFORMADO')return 'NI';", 1)

          pat = r"function gruposComandantes\(registros\)\{.*?\}function render"
          rep = """function gruposComandantes(registros){let m={};registros.forEach(o=>{if(ehNaoInformado(o.comandante))return;let chave=chaveComandante(o.comandante);if(!chave)return;if(!m[chave])m[chave]={chave,nome:norm(o.comandante),data:o.data_ocorrencia||'',registros:[]};m[chave].registros.push(o);if(String(o.data_ocorrencia||'')>String(m[chave].data||'')){m[chave].data=o.data_ocorrencia||'';m[chave].nome=norm(o.comandante)}});return Object.values(m).sort((x,y)=>y.registros.length-x.registros.length||x.nome.localeCompare(y.nome))}function render"""
          s,n = re.subn(pat,rep,s,count=1,flags=re.S)
          if n != 1: raise SystemExit('gruposComandantes nao encontrado')

          pat = r"function listaPessoas\(a,prefix\)\{.*?\}function perfil\(a,prefix,chartId,box\)\{.*?\}\nasync function carregar"
          rep = """function dadosPessoaInformados(n,s,i){return [n,s,i].some(v=>!ehNaoInformado(v))}
function listaPessoas(a,prefix){let chave=prefix==='vitima'?'vitimas':'infratores',lista=[];a.forEach(x=>{let n=x[prefix+'_nacionalidade'],s=x[prefix+'_sexo'],i=x[prefix+'_idade'];if(dadosPessoaInformados(n,s,i))lista.push({nacionalidade:n,sexo:s,idade:i});let texto=String(x.observacao_final||''),marca='[[PESSOAS_ENVOLVIDAS]]',p=texto.indexOf(marca);if(p>=0)try{let dados=JSON.parse(texto.slice(p+marca.length));lista.push(...(dados[chave]||[]).filter(pessoa=>dadosPessoaInformados(pessoa.nacionalidade,pessoa.sexo,pessoa.idade)))}catch(_){}});return lista}
function perfil(a,prefix,chartId,box){let pessoas=listaPessoas(a,prefix),nacs=rank(pessoas,x=>normalizarNacionalidade(x.nacionalidade),20),sex=rank(pessoas,x=>normalizarSexo(x.sexo),8),idades=pessoas.map(x=>num(x.idade)).filter(Boolean),faltNac=pessoas.filter(x=>ehNaoInformado(x.nacionalidade)).length,faltSexo=pessoas.filter(x=>ehNaoInformado(x.sexo)).length,faltIdade=pessoas.filter(x=>ehNaoInformado(x.idade)).length;chart(chartId,'doughnut',sex.map(x=>x[0]),sex.map(x=>x[1]),'Sexo',sex.map(x=>corSexo(x[0])));let linhas=nacs.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join('');$(box).innerHTML=`<table><tr><th>Nacionalidade</th><th>Quantidade</th></tr>${linhas||'<tr><td colspan="2">Sem nacionalidade informada</td></tr>'}<tr><th>Faixa etária</th><td>${idades.length?Math.min(...idades)+' a '+Math.max(...idades)+' anos':'Sem idade informada'}</td></tr><tr><th>Pessoas identificadas</th><td>${pessoas.length}</td></tr><tr><th>Campos pendentes</th><td>Nacionalidade: ${faltNac} · Sexo: ${faltSexo} · Idade: ${faltIdade}</td></tr></table>`}
async function carregar"""
          s,n = re.subn(pat,rep,s,count=1,flags=re.S)
          if n != 1: raise SystemExit('perfil/listaPessoas dashboard nao encontrado')
          p.write_text(s,encoding='utf-8')

          # RELATORIO
          p = Path('relatorio.html')
          s = p.read_text(encoding='utf-8')
          pat = r"function rank\(a,k,max=999\)\{.*?\}\nfunction iso"
          rep = """function ehNaoInformadoRel(v){let z=S(v).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase();return !z||['NI','N/I','N','NA','NAO INFORMADO','NÃO INFORMADO'].includes(z)}
function rank(a,k,max=999){let m={};a.forEach(x=>{let bruto=typeof k==='function'?k(x):x[k];if(ehNaoInformadoRel(bruto))return;let z=S(bruto);m[z]=(m[z]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,max)}
function iso"""
          s,n = re.subn(pat,rep,s,count=1,flags=re.S)
          if n != 1: raise SystemExit('rank relatorio nao encontrado')

          pat = r"function comboRows\(d,prefix,status\)\{.*?\}\n\nasync function build"
          rep = """function pessoaRelTemDado(p){return [p?.nacionalidade,p?.sexo,p?.idade].some(v=>!ehNaoInformadoRel(v))}
function pessoasRelatorio(d,prefix){let chave=prefix==='vitima'?'vitimas':'infratores',lista=[];d.forEach(x=>{let principal={nacionalidade:x[prefix+'_nacionalidade'],sexo:x[prefix+'_sexo'],idade:x[prefix+'_idade']};if(pessoaRelTemDado(principal))lista.push(principal);let texto=String(x.observacao_final||''),marca='[[PESSOAS_ENVOLVIDAS]]',pos=texto.indexOf(marca);if(pos>=0)try{let dados=JSON.parse(texto.slice(pos+marca.length));lista.push(...(dados[chave]||[]).filter(pessoaRelTemDado))}catch(_){}});return lista}
function comboRows(d,prefix,status){let m={},pessoas=pessoasRelatorio(d,prefix);pessoas.forEach(p=>{let c=ehNaoInformadoRel(p.nacionalidade)?'NÃO INFORMADA':S(p.nacionalidade),sx=ehNaoInformadoRel(p.sexo)?'NÃO INFORMADO':S(p.sexo),k=c+'|'+sx;m[k]=(m[k]||0)+1});let rows=Object.entries(m).sort((a,b)=>b[1]-a[1]).map((x,i)=>{let[c,sx]=x[0].split('|');return`<tr><td>${i+1}</td><td>${status}</td><td>${E(c)}</td><td>${E(sx)}</td><td>${x[1]}</td></tr>`});return{rows,total:pessoas.length}}

async function build"""
          s,n = re.subn(pat,rep,s,count=1,flags=re.S)
          if n != 1: raise SystemExit('comboRows relatorio nao encontrado')
          p.write_text(s,encoding='utf-8')

          # PAGINA INICIAL
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pat = r"function rank\(arr,campo,fallback\)\{.*?\}\nfunction draw"
          rep = """function naoInformadoIndex(v){var k=String(v||'').trim().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase();return !k||['NI','N/I','N','NA','NAO INFORMADO','NÃO INFORMADO'].includes(k)}function rank(arr,campo,fallback){var m={};arr.forEach(function(x){var k=campo==='ocorrencia'?categoriaPrincipalIndex(x):campo==='bairro'?bairroPrincipalIndex(x.bairro):(x[campo]||x[fallback]||'').trim();if(naoInformadoIndex(k))return;m[k]=(m[k]||0)+1});return Object.entries(m).sort(function(a,b){return b[1]-a[1]}).slice(0,5)}
function draw"""
          s,n = re.subn(pat,rep,s,count=1,flags=re.S)
          if n != 1: raise SystemExit('rank index nao encontrado')
          p.write_text(s,encoding='utf-8')

      - name: Validar alteracoes
        run: |
          grep -q 'dadosPessoaInformados' dashboard.html
          grep -q 'ehNaoInformadoRel' relatorio.html
          grep -q 'naoInformadoIndex' index.html
          ! grep -q "if(!chave)chave='NÃO INFORMADO'" dashboard.html

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html relatorio.html index.html
          git commit -m "Corrige tratamento de NI e perfis estatisticos"
          git push origin HEAD:main
