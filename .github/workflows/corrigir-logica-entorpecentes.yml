          s=replace_once(s,
            "function filtrarTerritorio(base){return base.filter(x=>(!sisc.value||x.sisc===sisc.value)&&(!companhia.value||x.companhia===companhia.value))}",
            "function filtrarTerritorio(base){return base.filter(x=>(!sisc.value||x.sisc===sisc.value)&&(!companhia.value||x.companhia===companhia.value)&&(!municipioFiltro.value||S(x.municipio).toLowerCase().includes(municipioFiltro.value.toLowerCase()))&&(!bairroFiltro.value||S(x.bairro).toLowerCase().includes(bairroFiltro.value.toLowerCase())))}",
            'relatorio.html')

          marcador="function iso(d){return d.toISOString().slice(0,10)}"
          helpers="function normDrug(v){let k=S(v).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase();return k==='SKANK'?'SKUNK':S(v)}function drugTypes(o){let z=new Set(),it=Array.isArray(o.entorpecentes_itens)?o.entorpecentes_itens:[];it.forEach(i=>{if(N(i.quantidade)>0&&i.tipo)z.add(normDrug(i.tipo))});[['MACONHA','maconha'],['COCAÍNA','cocaina'],['PASTA BASE','pasta_base'],['CRACK','crack'],['SKUNK','skank']].forEach(([t,c])=>{if(N(o[c])>0)z.add(t)});if(!z.size&&S(o.entorpecentes)==='SIM')z.add('TIPO NÃO INFORMADO');return [...z]}function hasDrug(o){return drugTypes(o).length>0}function drugIncidence(d){let m={};d.forEach(o=>drugTypes(o).forEach(t=>m[t]=(m[t]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}function drugMaterials(d){let m={};d.forEach(o=>(Array.isArray(o.entorpecentes_itens)?o.entorpecentes_itens:[]).forEach(i=>{let t=normDrug(i.tipo),f=S(i.forma_apresentacao||i.forma||i.unidade);if(!t||!f||N(i.quantidade)<=0)return;let k=t+'|'+f;m[k]=(m[k]||0)+N(i.quantidade)}));return Object.entries(m).map(([k,q])=>{let[t,f]=k.split('|');return[t,f,q]}).sort((a,b)=>a[0].localeCompare(b[0])||b[2]-a[2])}\n"
          s=replace_once(s,marcador,helpers+marcador,'relatorio.html')

          s=s.replace("d.filter(x=>S(x.entorpecentes)==='SIM').length", "d.filter(hasDrug).length")

          antigo="let white=spec(d.map(x=>x.arma_branca).filter(Boolean).join(';'));let p9=page('',`<h3 class=\"subtitle\">APREENSÕES DE ARMA BRANCA</h3>"
          novo="let drugInc=drugIncidence(d),drugIncOld=Object.fromEntries(drugIncidence(old)),drugMat=drugMaterials(d),drugSemForma=d.filter(hasDrug).filter(o=>!(Array.isArray(o.entorpecentes_itens)&&o.entorpecentes_itens.length)).length;let white=spec(d.map(x=>x.arma_branca).filter(Boolean).join(';'));let p9=page('',`<h3 class=\"subtitle\">ENTORPECENTES — INCIDÊNCIA POR OCORRÊNCIA</h3>${table(['TIPO','OCORRÊNCIAS','COMPARADO','VARIAÇÃO'],drugInc.map(x=>`<tr><td>${E(x[0])}</td><td>${x[1]}</td><td>${drugIncOld[x[0]]||0}</td><td>${variance(x[1],drugIncOld[x[0]]||0)}</td></tr>`),`<tr class=\"total\"><td>TOTAL DE OCORRÊNCIAS COM ENTORPECENTES</td><td>${d.filter(hasDrug).length}</td><td>${old.filter(hasDrug).length}</td><td>${variance(d.filter(hasDrug).length,old.filter(hasDrug).length)}</td></tr>`)}<h3 class=\"subtitle\">ENTORPECENTES — QUANTIDADE VISUAL POR APRESENTAÇÃO</h3>${table(['TIPO','FORMA DE APRESENTAÇÃO','QUANTIDADE'],drugMat.map(x=>`<tr><td>${E(x[0])}</td><td>${E(x[1])}</td><td>${x[2]}</td></tr>`))}<p class=\"small\"><b>Regra institucional:</b> não são utilizados pesos ou medidas. ${drugSemForma} ocorrência(s) legada(s)/sem apresentação estruturada foram preservadas e não entram nas somas de materiais.</p><h3 class=\"subtitle\">APREENSÕES DE ARMA BRANCA</h3>"
          s=replace_once(s,antigo,novo,'relatorio.html')

          s=s.replace("g.filter(y=>S(y.entorpecentes)==='SIM').length", "g.filter(hasDrug).length")
          s=s.replace("d.filter(x=>S(x.entorpecentes)==='SIM').length", "d.filter(hasDrug).length")

          s=replace_once(s,
            "comparar.value=q.get('comparar')||'ano';sisc.value=q.get('sisc')||'';companhia.value=q.get('companhia')||'';",
            "comparar.value=q.get('comparar')||'ano';sisc.value=q.get('sisc')||'';companhia.value=q.get('companhia')||'';municipioFiltro.value=q.get('municipio')||'';bairroFiltro.value=q.get('bairro')||'';",
            'relatorio.html')

          p.write_text(s,encoding='utf-8')

      - name: Validar regras institucionais
        run: |
          grep -q "FORMAS_ENTORPECENTES" cadastro.html
          grep -q "forma_apresentacao" cadastro.html
          ! grep -q 'UNIDADES_ENTORPECENTES' cadastro.html
          grep -q "Análise de Entorpecentes" dashboard.html
          grep -q "incidenciaEntorpecentes" dashboard.html
          grep -q "ENTORPECENTES — INCIDÊNCIA POR OCORRÊNCIA" relatorio.html
          grep -q "não são utilizados pesos ou medidas" relatorio.html

      - name: Publicar alterações
        run: |
          if git diff --quiet; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cadastro.html dashboard.html relatorio.html
          git commit -m "Corrige entorpecentes para contagem visual sem peso"
          git push
