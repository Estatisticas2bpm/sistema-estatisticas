<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Estatísticas Operacionais</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef2f6;
            color: #1f2937;
        }

        header {
            padding: 32px 20px;
            background: #132b46;
            color: white;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            opacity: 0.85;
        }

        main {
            width: min(1100px, 92%);
            margin: 30px auto;
        }

        .painel {
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .indicadores {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 24px 0;
        }

        .indicador {
            padding: 20px;
            border: 1px solid #dce3ea;
            border-radius: 10px;
        }

        .indicador strong {
            display: block;
            margin-top: 8px;
            font-size: 28px;
            color: #132b46;
        }

        .acoes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        button {
            min-height: 55px;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #1d4ed8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        footer {
            padding: 25px;
            text-align: center;
            color: #64748b;
        }

        @media (max-width: 750px) {
            .indicadores,
            .acoes {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Sistema de Estatísticas Operacionais</h1>
        <p>Cadastro e análise de ocorrências</p>
    </header>

    <main>
        <section class="painel">
            <h2>Painel inicial</h2>

            <p>Selecione uma opção para começar.</p>

            <div class="indicadores">
                <div class="indicador">
                    Ocorrências no mês
                    <strong>0</strong>
                </div>

                <div class="indicador">
                    Materiais registrados
                    <strong>0</strong>
                </div>

                <div class="indicador">
                    Pessoas conduzidas
                    <strong>0</strong>
                </div>
            </div>

            <div class="acoes">
                <button onclick="abrirCadastro()">
                    Cadastrar ocorrência
                </button>

                <button onclick="abrirConsulta()">
                    Consultar ocorrências
                </button>

                <button onclick="abrirDashboard()">
                    Abrir dashboard
                </button>
            </div>
        </section>
    </main>

    <footer>
        Sistema de Estatísticas Operacionais
    </footer>

    <script>
        function abrirCadastro() {
            alert("A tela de cadastro será criada na próxima etapa.");
        }

        function abrirConsulta() {
            alert("A consulta será criada posteriormente.");
        }

        function abrirDashboard() {
            alert("O dashboard será criado posteriormente.");
        }
    </script>
</body>
</html>
