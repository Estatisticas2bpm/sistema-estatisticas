<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa TV - 2º BPM</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#061321;font-family:Inter,Segoe UI,Arial,sans-serif}.screen{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:1.2vh 1vw;gap:1vh;background:linear-gradient(135deg,#061321,#092440);color:#fff}header{display:flex;justify-content:space-between;align-items:center;padding:0 .5vw}.brand{display:flex;align-items:center;gap:.7vw}.brand img{height:5.2vh;max-height:58px}.brand b{font-size:clamp(17px,1.25vw,25px)}.brand span{display:block;color:#bcd2e4;font-size:clamp(10px,.72vw,14px)}.date{text-align:right}.date b{display:block;font-size:clamp(15px,1.1vw,22px)}.date span{color:#9ee5e7;font-size:clamp(10px,.72vw,14px)}#mapa{height:100%;border-radius:1vw;overflow:hidden;border:1px solid #ffffff20}.footer{display:flex;justify-content:space-between;gap:10px;color:#b8cadd;font-size:clamp(10px,.72vw,14px);padding:0 .5vw}.live{color:#72e3b7;font-weight:900}.legend{background:#061b2eea;color:#e7f0f6;border:1px solid #ffffff22;border-radius:10px;padding:8px 10px;line-height:1.7;font-size:11px}.legend b{display:block}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;border:1px solid #fff}</style></head><body><main class="screen"><header><div class="brand"><img src="brasao-pmrr.png"><img src="logo-2bpm-novo.png"><div><b>Mapa Criminal — 2º BPM</b><span>Ocorrências georreferenciadas do mês atual</span></div></div><div class="date"><b id="hora"></b><span id="data"></span></div></header><div id="mapa"></div><footer class="footer"><span><span class="live">● MAPA ATIVO</span> · atualização automática a cada 60 segundos</span><span id="status">Carregando ocorrências...</span></footer></main><script>const db=supabase.createClient('https://jppmhhukujigxupgskdk.supabase.co','sb_publishable_ZVnU35i2x9zwppQqYg7UYw_mzaT43aG');const mapa=L.map('mapa',{zoomControl:false,scrollWheelZoom:false,dragging:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false}).setView([2.8235,-60.6758],12),pontos=L.layerGroup().addTo(mapa);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(mapa);let leg=L.control({position:'bottomright'});leg.onAdd=()=>{let d=L.DomUtil.create('div','legend');d.innerHTML='<b>Natureza</b><i style="background:#dc2626"></i>Roubo<br><i style="background:#f59e0b"></i>Furto<br><i style="background:#8b5cf6"></i>Violência doméstica<br><i style="background:#2563eb"></i>Trânsito<br><i style="background:#16a34a"></i>Drogas<br><i style="background:#64748b"></i>Outras';return d};leg.addTo(mapa);function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function chave(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase()}function cat(v){let k=chave(v);if(k.includes('ROUBO'))return'#dc2626';if(k.includes('FURTO'))return'#f59e0b';if(k.includes('MARIA DA PENHA')||k.includes('VIOLENCIA DOMESTICA'))return'#8b5cf6';if(k.includes('TRANSITO')||k.includes('ACIDENTE'))return'#2563eb';if(k.includes('DROGA')||k.includes('ENTORPECENTE')||k.includes('TRAFICO'))return'#16a34a';return'#64748b'}function relogio(){let d=new Date();hora.textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});data.textContent=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}async function carregar(){let h=new Date(),i=new Date(h.getFullYear(),h.getMonth(),1),r=await db.rpc('obter_dados_dashboard',{data_inicio:iso(i),data_fim:iso(h)});if(r.error){status.textContent='Erro ao atualizar mapa';return}let d=(r.data||[]).filter(x=>Number.isFinite(Number(x.latitude))&&Number.isFinite(Number(x.longitude)));pontos.clearLayers();let lim=[];d.forEach(x=>{L.circleMarker([Number(x.latitude),Number(x.longitude)],{radius:7,color:'#fff',weight:2,fillColor:cat(x.ocorrencia||x.crime),fillOpacity:.94}).addTo(pontos);lim.push([Number(x.latitude),Number(x.longitude)])});if(lim.length)mapa.fitBounds(lim,{padding:[8,8],maxZoom:18});else mapa.setView([2.8235,-60.6758],12);status.textContent=d.length+' ocorrência(s) georreferenciada(s) · atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}relogio();setInterval(relogio,1000);carregar();setInterval(carregar,60000);</script></body></html>
