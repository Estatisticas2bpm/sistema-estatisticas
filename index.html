<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estatísticas Operacionais</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef2f6;
            color: #1f2937;
        }

        header {
            padding: 24px 20px;
            background: #132b46;
            color: white;
        }

        .cabecalho-institucional {
            width: min(1100px, 94%);
            margin: auto;
            display: grid;
            grid-template-columns: 120px 1fr 120px;
            align-items: center;
            gap: 24px;
        }

        .logo-institucional {
            width: 120px;
            height: 120px;
            object-fit: contain;
            background: white;
            border-radius: 14px;
            padding: 5px;
        }

        .titulo-institucional {
            text-align: center;
        }

        .titulo-institucional h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .titulo-institucional p {
            margin: 0 0 5px;
            font-size: 18px;
            font-weight: bold;
        }

        .titulo-institucional span {
            font-size: 14px;
            opacity: 0.88;
        }

        main {
            width: min(1100px, 92%);
            margin: 30px auto;
        }

        .painel {
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .painel h2 {
            margin-top: 0;
        }

        .indicadores {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 24px 0;
        }

        .indicador {
            padding: 20px;
            border: 1px solid #dce3ea;
            border-radius: 10px;
        }

        .indicador strong {
            display: block;
            margin-top: 8px;
            font-size: 28px;
            color: #132b46;
        }

        .acoes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        button {
            min-height: 55px;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #2556d8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        footer {
            padding: 25px;
            text-align: center;
            color: #64748b;
        }

        @media (max-width: 750px) {
            .cabecalho-institucional {
                grid-template-columns: 74px 1fr 74px;
                gap: 10px;
            }

            .logo-institucional {
                width: 74px;
                height: 74px;
            }

            .titulo-institucional h1 {
                font-size: 19px;
            }

            .titulo-institucional p {
                font-size: 14px;
            }

            .titulo-institucional span {
                font-size: 11px;
            }

            .indicadores,
            .acoes {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 500px) {
            .cabecalho-institucional {
                grid-template-columns: 1fr;
                justify-items: center;
            }

            .logo-institucional {
                width: 90px;
                height: 90px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="cabecalho-institucional">
            <img src="logo-cpc.jpeg" alt="Logo do Comando de Policiamento da Capital" class="logo-institucional">

            <div class="titulo-institucional">
                <h1>Sistema de Estatísticas Operacionais</h1>
                <p>2º Batalhão da Polícia Militar</p>
                <span>Comando de Policiamento da Capital</span>
            </div>

            <img src="logo-2bpm.jpeg" alt="Logo do 2º Batalhão da Polícia Militar" class="logo-institucional">
        </div>
    </header>

    <main>
        <section class="painel">
            <h2>Painel inicial</h2>
            <p>Selecione uma opção para começar.</p>

            <div class="indicadores">
                <div class="indicador">
                    Ocorrências no mês
                    <strong>0</strong>
                </div>

                <div class="indicador">
                    Materiais registrados
                    <strong>0</strong>
                </div>

                <div class="indicador">
                    Pessoas conduzidas
                    <strong>0</strong>
                </div>
            </div>

            <div class="acoes">
                <button onclick="abrirCadastro()">Cadastrar ocorrência</button>
                <button onclick="abrirConsulta()">Consultar ocorrências</button>
                <button onclick="abrirDashboard()">Abrir dashboard</button>
            </div>
        </section>
    </main>

    <footer>
        2º Batalhão da Polícia Militar — Sistema de Estatísticas Operacionais
    </footer>

    <script>
        function abrirCadastro() {
            window.location.href = "cadastro.html";
        }

        function abrirConsulta() {
            alert("A consulta será criada posteriormente.");
        }

        function abrirDashboard() {
            alert("O dashboard será criado posteriormente.");
        }
    </script>
</body>
</html>
